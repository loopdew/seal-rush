/* ============================================================
   14. 玩法
   ============================================================ */
function avoid(o){                       // 标题页自动巡航用的避障力
  if(o.dead) return 0;
  const dz=S.z-o.z;
  if(dz<-4 || dz>46) return 0;
  const dx=o.x-S.x, danger=o.r+2.8, ad=Math.abs(dx);
  if(ad>=danger) return 0;
  return (dx>0?-1:1)*(1-ad/danger)*(1-dz/46)*2.4;
}
function addFever(v){
  if(S.fever>0 || S.state!=='play') return;
  S.gauge = Math.min(1,S.gauge+v);
  if(S.gauge>=1){
    S.fever=FEVER_T; kick(5); Snd.fever(); toast('狂热时间',true);
    ring(S.x,S.y,S.z,9,0xFFC94A,0.6); emitBurst(S.x,S.y+0.9,S.z,30,0xFFC94A);
  }
}
function eat(f){
  f.dead=true;
  S.comboT=2.8; S.combo=Math.min(S.combo+1,20); S.bestCombo=Math.max(S.bestCombo,S.combo);
  S.fish++;
  const gain=Math.round((f.gold?60:10)*S.combo*(S.ball?1.5:1)*(S.fever>0?2:1));
  S.score+=gain; Snd.coin(S.combo,f.gold);
  emitBurst(f.x, f.wy||S.y+1, f.z, f.gold?24:9, 0xFFC94A);
  popup((f.gold?'金鱼 +':'+')+gain, (f.gold||S.combo>=6)?'good':'');
  kick(1.5); J.mouthT=0.16; if(S.combo>=5||f.gold) J.happyT=0.5;
  addFever(f.gold?0.22:0.04);
  if(S.mode!=='zen' && S.fish%25===0 && S.hearts<3){ S.hearts++; paintHearts(); popup('补回一颗心','good'); }
}
function smash(o){
  o.dead=true; o.passed=true; chunksDirty=true; S.smashed++;
  const w=waterAt(o.x,o.z);
  const y=(w.inPool ? w.waterY : surfaceY(o.x,o.z))+1.0;
  emitBurst(o.x,y,o.z,26,o.tall?0xBFF0FF:(w.inPool?0xA9DDF2:0xFFFFFF));
  if(w.inPool) emitWaterSplash(o.x,w.waterY,o.z,16,1.2); else emitSpray(o.x,y-0.7,o.z,14,1.8);
  ring(o.x,y-0.9,o.z,3.4,o.tall?0xBFF0FF:0xDDF6FF,0.35,0.65);
  Snd.smash(); S.shake=Math.max(S.shake,0.3);
}
function slamBlast(rad=SLAM_R, superSlam=false, waterBomb=false){
  let n=0;
  const k=chunkK(S.z), r2=rad*rad;
  if(S.mode!=='zen') for(const c of [chunks.get(k-1),chunks.get(k),chunks.get(k+1)]){
    if(!c) continue;
    const lists = waterBomb ? [c.floes,c.reefs,c.rocks,c.pillars] : [c.rocks,c.pillars,c.snowballs,c.floes];
    for(const list of lists) for(const o of list){
      if(o.dead) continue;
      const dx=o.x-S.x, dz=o.z-S.z;
      if(dx*dx+dz*dz<r2){ smash(o); n++; }
    }
  }
  const fishR2 = waterBomb ? 30 : (superSlam ? 34 : 22);
  for(const f of fishList){
    if(f.dead) continue;
    const dx=f.x-S.x, dz=f.z-S.z;
    if(dx*dx+dz*dz<fishR2 && (waterBomb || f.lift<2)) eat(f);
  }
  const mult = superSlam ? 1.8 : 1;
  const bonus=Math.round((25+n*42)*S.combo*mult);
  S.score+=bonus; addFever((superSlam?0.09:0.05)+n*0.06);
  const tag = waterBomb ? '鱼雷入水' : (superSlam ? '空翻暴砸' : '肚皮砸地');
  popup(n ? tag+' 碎×'+n+' +'+bonus : tag+' +'+bonus, waterBomb?'water':'good');
  if(n || superSlam) S.hitstop=0.05;
}
function land(groundY,play,v){
  const vyRel = S.vy + v*GRADE;
  const impact = clamp(-vyRel/22,0,1.6);
  S.y=groundY;
  if(S.slam){
    const rad = S.superSlam ? 8.2 : SLAM_R, isSup = S.superSlam;
    S.slam=false; S.superSlam=false; S.rebound=true; S.vy=9.5-v*GRADE*0.35; S.airT=0;
    kick(-10); S.shake=Math.max(S.shake, isSup?0.85:0.7); Snd.slam();
    ring(S.x,groundY,S.z,rad,isSup?0xFFC94A:0xFFFFFF,0.52); ring(S.x,groundY,S.z,rad*0.55,0xA9F0E0,0.35);
    emitSpray(S.x,groundY+0.2,S.z,isSup?66:54,2.6);
    if(play) slamBlast(rad,isSup,false);
    return;
  }
  if(vyRel<-3.5){
    Snd.land(); emitSpray(S.x, groundY+0.15, S.z, Math.round(10+impact*22), 1+impact);
    S.shake = Math.max(S.shake, impact*0.3); kick(-3-impact*5);
    if(impact>0.45) ring(S.x,groundY,S.z,3.4,0xFFFFFF,0.4);
  }
  if(S.flip){
    seal.flip.rotation.x -= TAU;
    if(play){
      const bonus = Math.round((60+S.airT*90)*S.combo);
      S.score += bonus; Snd.flip(); popup('后空翻 +'+bonus,'good'); J.happyT=0.9; addFever(0.12);
    }
  }
  S.air=false; S.flip=false; S.rebound=false; S.superSlam=false; S.vy=0; S.airT=0;
}
function updateSeal(dt,t){
  const play = S.state==='play';
  S.prevX = S.x; S.prevZ = S.z;

  // 转向
  let steer=0;
  if(play){
    if(S.keyL) steer-=1;
    if(S.keyR) steer+=1;
    if(drag.active && Math.abs(drag.steer)>0.06) steer+=drag.steer;
  }else{
    let bx=null, bd=1e9;
    for(const f of fishList){
      if(f.dead||f.lift>1||f.sub) continue;
      const dz=S.z-f.z;
      if(dz>2 && dz<60){ const d=Math.abs(f.x-S.x)+dz*0.05; if(d<bd){ bd=d; bx=f.x; } }
    }
    steer = bx===null ? Math.sin(t*0.5)*0.5 : clamp((bx-S.x)*0.4,-1,1);
    for(const c of chunks.values()){
      if(c.zBot>S.z+6 || c.zTop<S.z-46) continue;
      for(const o of c.pillars) steer+=avoid(o);
      for(const o of c.rocks) steer+=avoid(o);
      for(const o of c.floes) steer+=avoid(o);
    }
  }
  steer = clamp(steer,-1,1);
  S.steer = damp(S.steer,steer,12,dt);
  S.vx += S.steer*(S.air?24:(S.inWater?34:30))*dt;
  S.vx = damp(S.vx,0,S.air?0.7:(S.inWater?4.2:3.4),dt);
  S.x += S.vx*dt;
  const lim = TRACK_HALF-0.9;
  if(Math.abs(S.x)>lim){
    const hard = S.vx*Math.sign(S.x) > 5;
    S.x = clamp(S.x,-lim,lim);
    if(hard && play){
      S.speedMod = Math.min(S.speedMod,0.72); S.shake = Math.max(S.shake,0.16); kick(-3);
      if(S.inWater) emitWaterSplash(S.x, GRADE*S.z+WATER_OFF, S.z, 12, 0.9);
      else emitSpray(S.x, surfaceY(S.x,S.z)+0.2, S.z, 14, 1.3);
      if(S.ball) dropBall('蹭到边缘，金球掉了');
    }
    S.vx *= -0.15;
  }

  // 前进
  const cap = !play ? 23 : (S.mode==='zen' ? 38 : 56);
  S.speed = damp(S.speed, Math.min(cap, 20+Math.max(0,-S.z)*0.014), S.mode==='zen'?0.5:0.75, dt);
  S.speedMod = damp(S.speedMod,1,1.5,dt);
  if(S.boost>0) S.boost -= dt;
  const v = curV();
  S.z -= v*dt;
  if(play) S.dist = -S.z;

  // 地形 / 跳台 / 冰海入水与潜泳
  const base = surfaceY(S.x,S.z);
  const w = waterAt(S.x,S.z);
  const wasWater = S.inWater;
  let lift = 0, ramp = null;

  if(w.inPool){
    if(!wasWater && (!S.air || S.y <= w.waterY)){
      S.inWater = true;
      if(S.slam){
        const isSup = S.superSlam;
        S.slam=false; S.superSlam=false; S.air=false; S.flip=false; S.rebound=false; S.vy=0; S.airT=0;
        S.diving=true; S.diveT=DIVE_DUR;
        kick(-10); S.shake=Math.max(S.shake,0.55); Snd.splash(true);
        emitWaterSplash(S.x,w.waterY,S.z,46,1.9); ring(S.x,w.waterY,S.z,isSup?7.5:6.2,0xA9DDF2,0.5,0.65);
        if(play) slamBlast(isSup?8.2:SLAM_R, isSup, true);
      }else{
        if(S.flip){
          seal.flip.rotation.x -= TAU;
          if(play){ const b=Math.round(70*S.combo); S.score+=b; addFever(0.12); Snd.flip(); popup('花式入水 +'+b,'water'); }
        }
        S.air=false; S.flip=false; S.rebound=false; S.superSlam=false; S.vy=0; S.airT=0;
        kick(-5); Snd.splash(false);
        emitWaterSplash(S.x,w.waterY,S.z,24,1.25); ring(S.x,w.waterY,S.z,3.8,0xDDF6FF,0.42,0.52,true);
      }
      if(play && !S.waterHinted){
        S.waterHinted=true; toast('进入冰海 · '+(isTouch?'轻点跳 / 下滑潜泳':'空格跃起 / S 潜泳'));
      }
    }

    if(S.air){
      S.airT += dt; S.vy -= GRAV*dt; S.y += S.vy*dt;
      const surfT = w.waterY - 0.44;
      if(S.y <= surfT && (S.vy + v*GRADE) <= 0){
        S.inWater=true; S.y=surfT;
        if(S.slam){
          const isSup = S.superSlam;
          S.slam=false; S.superSlam=false; S.diving=true; S.diveT=DIVE_DUR;
          kick(-10); S.shake=Math.max(S.shake,0.5); Snd.splash(true);
          emitWaterSplash(S.x,w.waterY,S.z,42,1.8); ring(S.x,w.waterY,S.z,6.0,0xA9DDF2,0.5,0.65);
          if(play) slamBlast(SLAM_R, isSup, true);
        }else{
          if(S.flip){
            seal.flip.rotation.x -= TAU;
            if(play){ const b=Math.round(65*S.combo); S.score+=b; addFever(0.1); Snd.flip(); popup('海豚空翻 +'+b,'water'); J.happyT=0.8; }
          }else{ Snd.splash(false); emitWaterSplash(S.x,w.waterY,S.z,20,1.1); ring(S.x,w.waterY,S.z,3.0,0xDDF6FF,0.38,0.48,true); }
          kick(-4);
        }
        S.air=false; S.flip=false; S.rebound=false; S.superSlam=false; S.vy=0; S.airT=0;
      }
    }else{
      if(S.diving){
        S.diveT -= dt;
        const p = clamp(1 - S.diveT/DIVE_DUR, 0, 1);
        const diveArc = Math.sin(Math.pow(p, 0.72)*Math.PI);
        const diveY = Math.max(base+0.45, w.waterY - 0.48 - clamp(w.depth-0.85, 0.9, 1.52)*diveArc + Math.sin(t*11)*0.11);
        S.y = damp(S.y, diveY, 12, dt);
        bubAcc += 15*dt*(REDUCED?0.5:1);
        while(bubAcc>1){ bubAcc-=1; emitBubbles(S.x, S.y+0.25, S.z+0.5, 1); }
        if(S.diveT <= 0){
          S.diving=false; emitWaterSplash(S.x,w.waterY,S.z,14,0.95); ring(S.x,w.waterY,S.z,3.0,0xDDF6FF,0.45,0.42,true); Snd.bubble();
        }
      }else{
        const swimY = w.waterY - 0.46 + Math.sin(t*7.5)*0.05;
        S.y = damp(S.y, swimY, 14, dt);
        sprayAcc += (0.55+v*0.06+Math.abs(S.steer)*v*0.10)*dt*(REDUCED?0.5:1);
        while(sprayAcc>1){ sprayAcc-=1; emitWaterSplash(S.x-S.steer*0.5, w.waterY, S.z+0.55, 1, 0.45+Math.abs(S.steer)*0.32); }
        wRippleAcc += (1.1+v*0.045)*dt*(REDUCED?0.5:1);
        while(wRippleAcc>1){ wRippleAcc-=1; ring(S.x, w.waterY, S.z+0.35, 2.3, 0xDDF6FF, 0.55, 0.28, true); }
      }
    }
  }else{
    if(wasWater){
      S.inWater=false;
      const wasDiv = S.diving; S.diving=false; S.diveT=0;
      if(!S.air){
        S.y = Math.max(S.y, base+0.2);
        const popVy = wasDiv ? 10.5 : 6.4;
        S.air=true; S.airT=0; S.flip=false; S.slam=false; S.superSlam=false; S.rebound=false;
        S.vy = popVy - v*GRADE; S.airDur = 2*popVy/GRAV;
        kick(4); Snd.splash(false); emitWaterSplash(S.x,S.y,S.z,22,1.2);
        if(play) popup('破水而出','water');
      }
    }
    const ck = chunkK(S.z);
    for(const rc of [chunks.get(ck), chunks.get(ck+1)]) if(rc) for(const r of rc.ramps){
      if(Math.abs(S.x-r.x)<r.w && S.z<=r.z && S.z>=r.z-r.len){ lift=r.h*clamp((r.z-S.z)/r.len,0,1); ramp=r; }
      const lip = r.z - r.len*0.85;
      if(r!==S.lastRamp && Math.abs(S.x-r.x)<r.w && S.prevZ>=lip && S.z<lip && S.y<=surfaceY(S.x,S.z)+r.h+1.6){
        S.lastRamp=r; S.air=true; S.airT=0; S.flip=true; S.slam=false; S.superSlam=false; S.rebound=false;
        const vyRel = 18.0 + lift*1.1;
        S.vy = vyRel - v*GRADE;
        S.airDur = 2*vyRel/GRAV;
        S.y = Math.max(S.y, base+r.h);
        kick(6); Snd.jump(); emitSpray(S.x, base+lift+0.2, S.z, 24, 1.7);
      }
    }
    const groundY = base+lift;
    if(S.air){
      S.airT += dt; S.vy -= GRAV*dt; S.y += S.vy*dt;
      if(S.y<=groundY && (S.vy+v*GRADE)<=0) land(groundY,play,v);
    }else{
      S.y = Math.max(groundY, damp(S.y,groundY,22,dt));
    }
  }

  // 首页点击 5 次开心转体 + 顶金球彩蛋
  let hopRot = null, hopY = 0;
  if(!play){
    if(attractLook.hopT>0){
      attractLook.hopT = Math.max(0, attractLook.hopT-dt);
      const p = 1 - attractLook.hopT/attractLook.hopDur;
      hopY = Math.sin(p*Math.PI)*0.95;
      hopRot = p*TAU;
    }
    if(attractLook.ballT>0) attractLook.ballT = Math.max(0, attractLook.ballT-dt);
  }

  // 姿态
  seal.root.position.set(S.x,S.y+hopY,S.z);
  seal.root.rotation.y = damp(seal.root.rotation.y, clamp(-S.vx*0.05,-0.55,0.55), 10, dt);
  seal.tilt.rotation.z = damp(seal.tilt.rotation.z, clamp(-S.vx*0.045,-0.5,0.5), 8, dt);
  if(hopRot!==null){
    seal.flip.rotation.x = hopRot;
  }else if(S.air && S.flip){
    seal.flip.rotation.x = Math.max(seal.flip.rotation.x, TAU*clamp(S.airT/S.airDur,0,1));
  }else{
    const dp = S.diving ? clamp(1 - S.diveT/DIVE_DUR, 0, 1) : 0;
    const divePitch = dp<0.25 ? lerp(-0.48,-0.10,dp/0.25) : dp>0.72 ? lerp(-0.08,0.34,(dp-0.72)/0.28) : -0.10;
    const pitch = S.slam ? -0.35 : S.diving ? divePitch : S.air ? clamp((S.vy+v*GRADE)*0.038,-0.7,0.8)
                : S.inWater ? (0.05+Math.sin(t*7.5)*0.07) : slopeAt(S.x,S.z)+(ramp?Math.atan(ramp.h/ramp.len):0);
    seal.flip.rotation.x = damp(seal.flip.rotation.x, pitch, 9, dt);
  }

  // 雪雾与滑痕 / 水波尾迹
  const grounded = !S.air && lift<0.05 && !S.diving;
  if(!S.air && !S.inWater){
    sprayAcc += (0.5+v*0.10+Math.abs(S.steer)*v*0.14)*dt*(REDUCED?0.5:1);
    while(sprayAcc>1){ sprayAcc-=1; emitSpray(S.x-S.steer*0.7, base+lift+0.1, S.z+0.7, 1, 0.55+v*0.012+Math.abs(S.steer)*0.5); }
  }
  pushTrail(S.x, S.z+0.5, grounded?1:0, S.inWater && !S.air && !S.diving);
}
function updateOver(dt,t){               // 结束后：滑行着停下，瘫成一团，头顶冒星星
  S.speed = damp(S.speed,0,2.2,dt);
  S.z -= S.speed*S.speedMod*dt;
  const w = waterAt(S.x,S.z), gy = w.inPool ? w.waterY-0.35 : surfaceY(S.x,S.z);
  if(S.air){
    S.vy -= GRAV*dt; S.y += S.vy*dt;
    if(S.y<=gy){ S.y=gy; S.air=false; S.slam=false; S.flip=false; S.rebound=false; kick(-5); }
  }else S.y = Math.max(gy, damp(S.y,gy,10,dt));
  seal.root.position.set(S.x,S.y,S.z);
  seal.tilt.rotation.z = damp(seal.tilt.rotation.z, 0, 4, dt);
  seal.flip.rotation.x = damp(seal.flip.rotation.x, S.air?0:(w.inPool?0:slopeAt(S.x,S.z)), 4, dt);
  pushTrail(S.x, S.z+0.5, S.air?0:1, w.inPool);
}

/* ---- 金球：顶在鼻尖上，转弯越急晃得越厉害 ---- */
function dropBall(reason){
  if(!S.ball) return;
  S.ball=false; S.ballWob=0; ballHolder=null; hideBall();
  ui.ballhud.classList.remove('on');
  emitBurst(S.x, S.y+1.6, S.z-1.2, 18, 0xFFC94A);
  Snd.ballDrop(); popup(reason,'bad');
}
function updateBall(dt,t){
  if(ballHolder){
    ballHolder.age += dt;
    const w=waterAt(ballHolder.x,ballHolder.z);
    ballHolder.y = (w.inPool?w.waterY:surfaceY(ballHolder.x,ballHolder.z))+1.0+Math.sin(t*2.6)*0.22;
    const dz=ballHolder.z-S.z;
    if(segDist2(S.prevX,S.prevZ,S.x,S.z,ballHolder.x,ballHolder.z)<4.4){
      ballHolder=null; S.ball=true; S.ballWob=0; J.happyT=1.2; kick(3);
      ui.ballhud.classList.add('on'); Snd.ballCatch(); popup('接住了','good');
      emitBurst(ballMesh.position.x, ballMesh.position.y, ballMesh.position.z, 22, 0xFFC94A);
    }else if(dz>30){ ballHolder=null; hideBall(); }
  }
  if(!ballHolder && !S.ball && S.dist>S.nextBallAt){
    S.nextBallAt = S.dist+800+Math.random()*500;
    const z=S.z-210, cc=chunks.get(chunkK(z)), mid=[1,2,3,4];
    let x=LANES[1+((Math.random()*4)|0)];
    if(cc){
      const obs=cc.rocks.concat(cc.pillars,cc.floes,cc.reefs);
      for(let tries=0;tries<4;tries++){
        const cx=LANES[mid[(Math.random()*4)|0]];
        if(!obs.some(o=>!o.dead && Math.abs(o.x-cx)<o.r+2.2 && Math.abs(o.z-z)<8)){ x=cx; break; }
      }
    }
    ballHolder={x,z,y:0,age:0}; ballMesh.visible=true; ballHalo.visible=true;
    toast('金球来了');
  }
  if(S.ball){
    S.ballWob += (Math.abs(S.steer)*1.15 + Math.abs(S.vx)*0.028 + (S.boost>0?0.9:0) + (S.air?0.45:0) + (S.diving?0.25:0) + (S.slam?3:0))*dt;
    S.ballWob = Math.max(0, S.ballWob-dt*0.62);
    if(S.ballWob>WOB_MAX) dropBall('晃得太厉害，金球掉了');
    else{
      S.score += (16+S.combo*2.2)*dt;
      ui.wobBar.style.width = (S.ballWob/WOB_MAX*100)+'%';
      ui.wob.classList.toggle('warn', S.ballWob>1.15);
    }
  }
}
function placeBall(dt,t){
  const show = S.ball || !!ballHolder || (S.state==='attract' && attractLook.ballT>0);
  ballMesh.visible=show; ballHalo.visible=show;
  if(!show) return;
  if(S.ball || (S.state==='attract' && attractLook.ballT>0)){
    const w=S.ball?S.ballWob:0.12;
    seal.noseAnchor.getWorldPosition(_p);
    ballMesh.position.set(_p.x+Math.sin(t*9)*w*0.16, _p.y-w*w*0.03, _p.z+Math.sin(t*7.4)*w*0.12);
  }else if(ballHolder) ballMesh.position.set(ballHolder.x,ballHolder.y,ballHolder.z);
  ballMesh.rotation.y += dt*1.8; ballMesh.rotation.x += dt*1.1;
  ballHalo.position.copy(ballMesh.position);
}

/* ---- 小鱼 / 加速带 / 气泡环 / 障碍 ---- */
function onHit(o){
  o.passed=true;
  if(o.vz!==undefined){ o.dead=true; chunksDirty=true; }
  const w=waterAt(o.x,o.z), y=(w.inPool?w.waterY:surfaceY(o.x,o.z))+1.0;
  S.inv=1.2; S.hurtT=1.0; S.hitstop=0.09; S.hearts--; paintHearts();
  S.speedMod=0.35; S.combo=1; S.comboT=0; S.shake=0.85; S.flash=1; kick(-9);
  Snd.hit(); emitBurst(o.x, y, o.z, 26, w.inPool?0xA9DDF2:0xFFFFFF);
  if(S.ball) dropBall('撞掉了金球'); else popup('撞上了','bad');
  if(S.hearts<=0) gameOver(false);
}
function updatePickups(dt){
  const px=S.x, pz=S.z, ppx=S.prevX, ppz=S.prevZ, mag=S.fever>0, cy=S.y+0.6;
  for(const f of fishList){
    if(f.dead) continue;
    const dz=f.z-pz;
    if(dz>4.5 || dz<(mag?-18:-4.5)) continue;
    if(mag && Math.abs(f.x-px)<8){ f.x=damp(f.x,px,7,dt); f.lift=damp(f.lift,0,6,dt); }
    const d2 = segDist2(ppx,ppz,px,pz,f.x,f.z), yTol = f.sub?(mag?2.8:1.65):2.4;
    if(d2<(mag?4.5:2.25) && Math.abs((f.wy||cy)-cy)<yTol) eat(f);
  }
  if(S.comboT>0){ S.comboT-=dt; if(S.comboT<=0) S.combo=1; }

  const k=chunkK(pz), c=chunks.get(k);
  if(!c) return;
  for(const cc of [c, chunks.get(k+1)]) if(cc) for(const p of cc.pads){
    if(p.used || S.air) continue;
    if(segDist2(ppx,ppz,px,pz,p.x,p.z)<5.8 && Math.abs(p.x-px)<2.1){
      p.used=true; S.boost=1.5; kick(4); Snd.pad();
      emitBurst(p.x, S.y+0.5, p.z, 14, 0x5FE0BE); popup('加速','good');
    }
  }
  for(const wr of wringList){
    if(wr.used) continue;
    const dz=wr.z-pz;
    if(dz>4.5 || dz<-5) continue;
    if(segDist2(ppx,ppz,px,pz,wr.x,wr.z)<5.8 && Math.abs((wr.wy||cy)-cy)<2.2){
      wr.used=true; chunksDirty=true; S.boost=1.65;
      const b=Math.round(80*S.combo); S.score+=b; kick(4); J.happyT=0.6; Snd.bubble(); Snd.pad();
      emitBurst(wr.x, wr.wy||cy, wr.z, 20, 0xA9DDF2); ring(wr.x, wr.wy||cy, wr.z, 4.2, 0xDDF6FF, 0.4, 0.6);
      popup('气泡加速 +'+b,'water'); addFever(0.1);
    }
  }
  if(S.mode==='zen') return;

  const clear = S.y-surfaceY(px,pz);
  for(const cc of [c, chunks.get(k+1)]){
    if(!cc) continue;
    for(const list of [cc.rocks,cc.pillars]) for(const o of list){
      if(o.dead) continue;
      const dz=o.z-pz;
      if(!o.passed && dz>1.4){
        o.passed=true;
        if(!mag && S.inv<=0){
          if(!S.air && Math.abs(o.x-px)<o.r+2.1){
            const b=Math.round(15*S.combo); S.score+=b; popup('擦边 +'+b,'good'); Snd.near(); addFever(0.08);
          }else if(S.air && !o.tall && Math.abs(o.x-px)<o.r+1.3){
            const b=Math.round(35*S.combo); S.score+=b; popup('飞跃 +'+b,'good'); Snd.near(); addFever(0.1);
          }
        }
        continue;
      }
      const rr=o.r+0.7;
      if(segDist2(ppx,ppz,px,pz,o.x,o.z)>=rr*rr) continue;
      if(!o.tall && S.air && clear>o.top*0.78) continue;
      if(mag){ smash(o); const b=Math.round(40*S.combo); S.score+=b; popup('撞碎 +'+b,'good'); S.hitstop=0.04; continue; }
      if(S.inv>0) continue;
      onHit(o); return;
    }
    for(const o of cc.reefs){
      if(o.dead) continue;
      const w=waterAt(o.x,o.z);
      if(!w.inPool || S.y >= w.waterY-0.85) continue;         // 浮在水面游泳时安全从暗礁上方掠过
      const dz=o.z-pz;
      if(!o.passed && dz>1.4){
        o.passed=true;
        if(!mag && S.inv<=0 && Math.abs(o.x-px)<o.r+2.0){
          const b=Math.round(25*S.combo); S.score+=b; popup('贴礁游过 +'+b,'water'); Snd.near(); addFever(0.08);
        }
        continue;
      }
      const rr=o.r+0.62;
      if(segDist2(ppx,ppz,px,pz,o.x,o.z)>=rr*rr) continue;
      if(mag){ smash(o); const b=Math.round(45*S.combo); S.score+=b; popup('撞碎暗礁 +'+b,'water'); S.hitstop=0.04; continue; }
      if(S.inv>0) continue;
      onHit(o); return;
    }
  }
  for(const fl of floeList){
    if(fl.dead) continue;
    const w=waterAt(fl.x,fl.z), dz=fl.z-pz;
    if(!fl.passed && dz>1.5){
      fl.passed=true;
      if(!mag && S.inv<=0 && Math.abs(fl.x-px)<fl.r+1.6){
        if(S.diving || S.y<w.waterY-0.95){ const b=Math.round(30*S.combo); S.score+=b; popup('水下穿行 +'+b,'water'); Snd.near(); addFever(0.08); }
        else if(S.air && S.y>w.waterY+0.25){ const b=Math.round(30*S.combo); S.score+=b; popup('跃过浮冰 +'+b,'water'); Snd.near(); addFever(0.08); }
        else{ const b=Math.round(15*S.combo); S.score+=b; popup('擦边 +'+b,'good'); Snd.near(); addFever(0.06); }
      }
      continue;
    }
    const rr=fl.r+0.62;
    if(segDist2(ppx,ppz,px,pz,fl.x,fl.z)>=rr*rr) continue;
    if((S.diving || S.y<w.waterY-0.95) || (S.air && S.y>w.waterY+0.25)) continue;
    if(mag || S.slam){ smash(fl); const b=Math.round(45*S.combo); S.score+=b; popup('碎冰 +'+b,'water'); S.hitstop=0.04; continue; }
    if(S.inv>0) continue;
    onHit(fl); return;
  }
  for(const sb of sballList){
    if(sb.dead) continue;
    const dz=sb.z-pz;
    if(!sb.passed && dz>1.5){
      sb.passed=true;
      if(!mag && S.inv<=0 && Math.abs(sb.x-px)<sb.r+2.2){
        const b=Math.round(25*S.combo); S.score+=b; popup('躲过雪球 +'+b,'good'); Snd.near(); addFever(0.08);
      }
      continue;
    }
    const rr=sb.r+0.65;
    if(segDist2(ppx,ppz,px,pz,sb.x,sb.z)>=rr*rr) continue;
    if(S.air && clear>sb.r*1.45) continue;
    if(mag){ smash(sb); const b=Math.round(45*S.combo); S.score+=b; popup('震碎雪球 +'+b,'good'); S.hitstop=0.04; continue; }
    if(S.inv>0) continue;
    onHit(sb); return;
  }
}
function attractEat(){                   // 标题页的海豹也真的在吃鱼
  for(const f of fishList){
    if(f.dead) continue;
    const dz=f.z-S.z;
    if(dz>2.5 || dz<-2.5) continue;
    const dx=f.x-S.x;
    if(dx*dx+dz*dz<2.1 && f.lift<1.5){ f.dead=true; emitBurst(f.x, f.wy||S.y+1, f.z, 7, 0xFFC94A); kick(1.5); J.mouthT=0.16; J.happyT=0.4; }
  }
}

/* ---- 天色过渡 ---- */
function updateBiome(dt){
  if(S.state==='play' && S.dist>S.nextBiomeAt){
    S.biome=(S.biome+1)%BIOMES.length; S.nextBiomeAt=S.dist+850+Math.random()*400;
    if(!S.inWater) ui.biome.textContent=BIOMES[S.biome].name;
    toast(BIOMES[S.biome].name);
  }else if(S.state==='attract'){
    S.attractT+=dt;
    if(S.attractT>11){ S.attractT=0; S.biome=(S.biome+1)%BIOMES.length; }
  }
  const wantWater = S.state==='play' && S.inWater;
  const biomeLbl = wantWater ? '冰海水道' : BIOMES[S.biome].name;
  if(ui.biome.textContent !== biomeLbl) ui.biome.textContent = biomeLbl;
  ui.biome.classList.toggle('water', wantWater);

  const B=BIOMES[S.biome], l=0.8, a=1-Math.exp(-l*dt);
  for(let i=0;i<4;i++) cur.sky[i].lerp(B.sky[i],a);
  cur.fog.lerp(B.fog,a); cur.hemiS.lerp(B.hemiS,a); cur.hemiG.lerp(B.hemiG,a); cur.sun.lerp(B.sun,a);
  cur.wCol.lerp(B.wCol,a); cur.wEmis.lerp(B.wEmis,a);
  cur.sunDir.lerp(B.sunDir,a).normalize();
  cur.fogN=damp(cur.fogN,B.fogN,l,dt); cur.fogF=damp(cur.fogF,B.fogF,l,dt);
  cur.hemiI=damp(cur.hemiI,B.hemiI,l,dt); cur.sunI=damp(cur.sunI,B.sunI,l,dt);
  cur.aur=damp(cur.aur,B.aur,l,dt); cur.star=damp(cur.star,B.star,l,dt);

  waterMat.color.copy(cur.wCol); waterMat.emissive.copy(cur.wEmis);
  scene.fog.color.copy(cur.fog).lerp(UW_FOG, uwMix);
  scene.fog.near=lerp(cur.fogN, 26, uwMix); scene.fog.far=lerp(cur.fogF, 150, uwMix);
  hemi.color.copy(cur.hemiS); hemi.groundColor.copy(cur.hemiG); hemi.intensity=cur.hemiI;
  sun.color.copy(cur.sun); sun.intensity=cur.sunI;
  sunSprite.material.color.copy(cur.sun); sunSprite.material.opacity=clamp(0.35+cur.sunI*0.2,0,0.95)*(1-uwMix*0.75);
  stars.material.opacity=cur.star*0.95*(1-uwMix*0.85); stars.visible=cur.star>0.01 && uwMix<0.9;
  auroraMat.opacity=cur.aur*(0.8+Math.sin(S.t*0.7)*0.15)*(1-uwMix*0.85); for(const m of auroras) m.visible=cur.aur>0.01 && uwMix<0.9;
  mtnMats[0].color.copy(cur.fog).lerp(cur.sky[1],0.42).lerp(UW_FOG, uwMix);
  mtnMats[1].color.copy(cur.fog).lerp(cur.sky[1],0.2).lerp(UW_FOG, uwMix);
  cloudMat.color.copy(cur.sky[3]).lerp(WHITE,0.6); cloudMat.opacity=0.8*(1-cur.star*0.8)*(1-uwMix*0.85);
  skyTimer+=dt;
  if(skyTimer>(uwMix>0.01?0.05:0.2)){ skyTimer=0; paintSky(); }
}

/* ---- 镜头：标题页在海豹正前方绕着看，开局后绕到身后 ---- */
const tLook = new THREE.Vector3();
let voSet = false;
function updateCamera(dt){
  const spdN = clamp((S.speed-20)/36,0,1);
  diveCam = damp(diveCam, (S.state==='play' && S.inWater && S.diving) ? 1 : 0, 7, dt);
  const back = 8.6+spdN*3.0, up = 4.1+spdN*0.5;
  camX = damp(camX, S.x*0.55, 6, dt);
  camY = damp(camY, S.y, 7, dt);
  const b = smooth(S.camBlend);
  const a0 = Math.sin(S.t*0.21)*0.8+0.2;
  const w=window.innerWidth, hh=window.innerHeight, portrait = w/hh<=1.15;
  const R0 = portrait ? 6.6*Math.pow(Math.max(1,1.15*hh/w),0.75) : 6.6;      // 竖屏视野窄，镜头退远一些
  const th = lerp(a0, Math.PI, b), R = lerp(R0, back, b), h = lerp(1.35, up, b);
  const cx = lerp(S.x,camX,b)+Math.sin(th)*R, cz = S.z-Math.cos(th)*R;
  let cy = camY + h;
  const gy = surfaceY(cx,cz)+0.72;
  const camW = waterAt(cx, cz);
  if(diveCam > 0.001 && camW.inPool){
    const uwY = Math.max(gy, camW.waterY - 1.35);
    cy = lerp(cy, uwY, smooth(diveCam));
  }
  if(cy<gy) cy=gy;
  camera.position.set(cx, cy, cz);
  const subTarget = (S.state==='play' && S.inWater && camW.inPool && cy < camW.waterY-0.12)
    ? smooth(clamp((camW.waterY-cy)/0.75, 0, 1)) : 0;
  uwMix = damp(uwMix, subTarget, 9, dt);
  tLook.set(lerp(S.x,camX*1.3,b), camY+lerp(0.85,0.1+0.25*diveCam,b), S.z-lerp(0.5,12+spdN*5,b));
  camera.lookAt(tLook);
  camera.rotation.z += clamp(-S.vx*0.006,-0.1,0.1)*b;
  camera.fov = damp(camera.fov, lerp(40, 62+spdN*14+(S.boost>0?4:0)+(S.fever>0?5:0), b), 5, dt);
  // 标题页把海豹让到没被文字盖住的那一侧
  const k=1-b;
  if(k>0.001){
    if(!portrait) camera.setViewOffset(w,hh,-w*0.19*k,0,w,hh); else camera.setViewOffset(w,hh,0,hh*0.25*k,w,hh);
    voSet=true;
  }else if(voSet){ camera.clearViewOffset(); voSet=false; }
  camera.updateProjectionMatrix();
  if(S.shake>0.002){
    const s=S.shake*(REDUCED?0.3:1);
    camera.position.x+=(Math.random()-0.5)*s*0.85; camera.position.y+=(Math.random()-0.5)*s*0.85;
  }
}

/* ============================================================
   15. 主循环
   ============================================================ */
let last = performance.now()/1000, hudAcc = 0, booted = false;
function frame(ms){
  requestAnimationFrame(frame);
  const now = ms/1000;
  let dt = clamp(now-last, 0.001, 0.05);
  last = now;
  if(S.state==='pause') return;
  if(S.hitstop>0){ S.hitstop-=dt; dt*=0.08; }             // 撞击瞬间的顿帧
  S.t += dt;
  const play = S.state==='play';

  updateBiome(dt);
  if(play || S.state==='attract') updateSeal(dt,S.t); else updateOver(dt,S.t);
  ensureChunks();
  if(play){
    updatePickups(dt);
    if(S.state==='play') updateBall(dt,S.t);
    S.score += S.speed*dt*0.9*(S.fever>0?2:1);
    if(S.inv>0) S.inv -= dt;
    if(S.fever>0){
      S.fever -= dt;
      if(S.fever<=0){ S.fever=0; S.gauge=0; S.inv=Math.max(S.inv,1.2); }
    }else S.gauge = Math.max(0, S.gauge-0.008*dt);
    S.camBlend = Math.min(1, S.camBlend+dt/1.25);
  }else if(S.state==='attract') attractEat();
  animateSeal(dt,S.t);
  if(chunksDirty){ syncStatic(); chunksDirty=false; }
  syncLive(dt,S.t);
  placeBall(dt,S.t);
  seal.root.visible = !(S.inv>0 && S.state==='play' && Math.floor(S.t*16)%2===0);
  S.shake = damp(S.shake,0,4.5,dt);
  S.flash = damp(S.flash,0,5,dt);
  updateTrail();
  updateRings(dt);
  updateCamera(dt);
  updateSpeedLines(dt);
  updateGlitter(S.t);
  TEX_PAD.offset.y = (TEX_PAD.offset.y - dt*1.6 + 1)%1;
  TEX_WATER.offset.y = (TEX_WATER.offset.y + dt*0.42)%1;
  TEX_WATER.offset.x = Math.sin(S.t*0.55)*0.06;
  TEX_WATER_NRM.offset.y = (TEX_WATER_NRM.offset.y + dt*0.30)%1;
  TEX_WATER_NRM.offset.x = -Math.sin(S.t*0.42)*0.08;
  snow.material.opacity = 0.8*(1 - uwMix*0.92);

  // 天空与灯光跟着镜头 / 海豹走
  const cp = camera.position;
  skyMesh.position.copy(cp); stars.position.copy(cp);
  for(const m of auroras){ const o=m.userData.off; m.position.set(cp.x+o[0], cp.y+o[1], cp.z+o[2]); }
  TEX_AURORA.offset.x = (TEX_AURORA.offset.x+dt*0.008)%1;
  mtns[0].position.set(cp.x, cp.y-140, cp.z); mtns[1].position.set(cp.x, cp.y-190, cp.z);
  for(const s of clouds){
    const u=s.userData; u.az+=u.sp*dt; if(u.az>1.9) u.az-=3.8; else if(u.az<-1.9) u.az+=3.8;
    const ce=Math.cos(u.el);
    s.position.set(cp.x+Math.sin(u.az)*ce*1380, cp.y+Math.sin(u.el)*1380, cp.z-Math.cos(u.az)*ce*1380);
  }
  sunSprite.position.copy(cp).addScaledVector(cur.sunDir,1440);
  sun.position.copy(seal.root.position).addScaledVector(cur.sunDir,90);
  sun.target.position.copy(seal.root.position);
  rim.position.set(S.x+6, S.y+6.6, S.z+9); rim.target.position.copy(seal.root.position);

  // 粒子：雪花、雪雾、水花、气泡、爆星
  { const a=snow.geometry.attributes.position.array, drift=S.speed*0.55;
    for(let i=0;i<SNOWN;i++){
      const o=i*3;
      a[o]   = wrap(a[o]+(snowVel[o]-S.vx*0.06)*dt, cp.x, SNOW_HX);
      a[o+1] = wrap(a[o+1]+snowVel[o+1]*dt, cp.y, SNOW_HY);
      a[o+2] = wrap(a[o+2]+(snowVel[o+2]+drift)*dt, cp.z, SNOW_HZ);
    }
    snow.geometry.attributes.position.needsUpdate=true; }
  { const a=spray.geometry.attributes.position.array, back=S.speed*0.8;
    for(let i=0;i<SPRAYN;i++){
      if(sprayL[i]<=0) continue;
      const o=i*3; sprayL[i]-=dt;
      if(sprayL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=sprayV[o]*dt; a[o+1]+=sprayV[o+1]*dt; a[o+2]+=(sprayV[o+2]+back)*dt; sprayV[o+1]-=7*dt;
    }
    spray.geometry.attributes.position.needsUpdate=true; }
  { const a=wSplash.geometry.attributes.position.array, back=S.speed*0.65;
    for(let i=0;i<SPLASHN;i++){
      if(wSplashL[i]<=0) continue;
      const o=i*3; wSplashL[i]-=dt;
      if(wSplashL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=wSplashV[o]*dt; a[o+1]+=wSplashV[o+1]*dt; a[o+2]+=(wSplashV[o+2]+back)*dt; wSplashV[o+1]-=14*dt;
    }
    wSplash.geometry.attributes.position.needsUpdate=true; }
  { const a=bubbles.geometry.attributes.position.array, back=S.speed*0.45;
    for(let i=0;i<BUBN;i++){
      if(bubL[i]<=0) continue;
      const o=i*3; bubL[i]-=dt;
      if(bubL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=bubV[o]*dt; a[o+1]+=bubV[o+1]*dt; a[o+2]+=(bubV[o+2]+back)*dt; bubV[o+1]+=1.2*dt;
    }
    bubbles.geometry.attributes.position.needsUpdate=true; }
  { const a=burst.geometry.attributes.position.array, back=S.speed*0.7;
    for(let i=0;i<BURSTN;i++){
      if(burstL[i]<=0) continue;
      const o=i*3; burstL[i]-=dt;
      if(burstL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=burstV[o]*dt; a[o+1]+=burstV[o+1]*dt; a[o+2]+=(burstV[o+2]+back)*dt; burstV[o+1]-=12*dt;
    }
    burst.geometry.attributes.position.needsUpdate=true; }

  Snd.frame(dt, S.speed*S.speedMod, play, S.fever>0, S.mode==='zen', S.inWater && S.diving);

  hudAcc += dt;
  if(hudAcc>0.07){
    hudAcc=0;
    ui.dist.textContent=fmt(S.dist); ui.score.textContent=fmt(S.score);
    ui.spd.textContent=Math.round(curV()*3.6);
    const on = S.combo>1 && S.comboT>0 && play;
    ui.combo.classList.toggle('on',on);
    if(on){ ui.comboB.textContent='×'+S.combo; ui.comboBar.style.transform='scaleX('+clamp(S.comboT/2.8,0,1)+')'; }
    const diveOn = play && S.inWater && S.diving;
    ui.divehud.classList.toggle('on', diveOn);
    if(diveOn) ui.diveBar.style.width = clamp(S.diveT/DIVE_DUR*100,0,100).toFixed(1)+'%';
    ui.uwtint.style.opacity = uwMix > 0.01 ? (uwMix*0.88).toFixed(2) : '0';
    if(play && S.dist >= S.nextMile){ toast('已滑行 '+S.nextMile+' 米！',true); S.nextMile+=500; }
    ui.fev.classList.toggle('on', S.fever>0);
    ui.fevBar.style.width = ((S.fever>0 ? S.fever/FEVER_T : S.gauge)*100).toFixed(1)+'%';
    ui.flash.style.opacity = S.flash>0.01 ? S.flash.toFixed(2) : 0;
    ui.glow.style.opacity = S.fever>0 ? (0.4+Math.sin(S.t*10)*0.12).toFixed(2) : 0;
  }
  renderer.render(scene,camera);
  if(!booted){ booted=true; window.__sealReady=true; $('boot').classList.add('done'); }
}

/* ============================================================
   16. 启动
   ============================================================ */
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(S.state==='pause') renderer.render(scene,camera);
}
window.addEventListener('resize', onResize);

function start(saved){
  if(saved && saved.best) for(const k of ['rush','zen']) if(saved.best[k]>BEST[k]) BEST[k]=saved.best[k];
  paintBest();
  buildSkins(); applySkin(S.skin, false);
  if(isTouch){
    ui.hint.textContent='拖动转向 · 轻点跳/破水 · 空中或水面下滑 砸地/潜泳';
    $('ctl-text').innerHTML='按住左右拖动转向，轻点起跳 / 破水，下滑砸地 / 潜泳<br>轻点海豹可互动';
  }
  paintModes(); paintMute(); paintSky(true);
  onResize();
  resetRun();
  showScreen(ui.scrStart);
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
try{ if(hot && hot.snapshot) hot.snapshot(()=>({best:BEST})); }catch(e){}
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

// 浏览器要求先有一次交互才能出声
const unlock = ()=>{ Snd.init(); Snd.resume(); };
window.addEventListener('pointerdown', unlock, {once:true});
window.addEventListener('keydown', unlock, {once:true});
</script>
