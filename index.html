<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海豹冲冲冲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/*
  Layout: the 3D slope is the page. The HUD is four small corner read-outs over it,
  and every menu is a scrim on a live frame of the world; the title screen keeps one
  side clear so the seal's face is the hero.
  One committed visual world (polar ice + a single warm accent, the seal's hat and scarf),
  so there are deliberately no prefers-color-scheme / data-theme blocks.
*/
:root{
  --ice:#F2F8FC;
  --ice-dim:#B4CADC;
  --deep:#08131F;
  --accent:#FF7A45;
  --gold:#FFC94A;
  --mint:#5FE0BE;
  --danger:#FF6B6B;
  --glass:rgba(8,19,31,.56);
  --panel:rgba(10,24,38,.66);
  --line:rgba(180,202,220,.24);
  --font-display:'ZCOOL KuaiLe','Fredoka','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-num:'Fredoka','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-ui:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --top:calc(14px + env(safe-area-inset-top,0px));
  --bot:calc(14px + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--deep);color:var(--ice);font-family:var(--font-ui);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash,#glow,#uwtint{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}
#flash{background:radial-gradient(ellipse at center,rgba(255,90,90,0) 42%,rgba(255,70,70,.6) 100%)}
#glow{background:radial-gradient(ellipse at center,rgba(255,201,74,0) 52%,rgba(255,186,70,.5) 100%)}
#uwtint{background:radial-gradient(ellipse at center,rgba(45,175,205,0) 42%,rgba(8,48,74,.42) 100%);transition:opacity .25s ease}
#popups{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:8;pointer-events:none;transition:opacity .5s ease}
#hud.off{opacity:0}
.hud-tl,.hud-tr,.hud-bl{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(9px)}
.hud-tl{position:absolute;top:var(--top);left:var(--gut-l);display:flex;flex-direction:column;gap:7px;padding:9px 14px 11px;border-radius:16px}
.hud-tr{position:absolute;top:var(--top);right:var(--gut-r);display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding:9px 14px 11px;border-radius:16px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat-k{font-size:11px;letter-spacing:.16em;color:var(--ice-dim);font-weight:600}
.stat-v{display:flex;align-items:baseline;gap:4px;font-family:var(--font-num);font-weight:600;line-height:1.05}
.stat-v b{font-size:30px;font-variant-numeric:tabular-nums}
.stat-v i{font-size:13px;font-style:normal;color:var(--ice-dim)}
.stat.score .stat-v b{font-size:22px;color:var(--gold)}
.stat.right{align-items:flex-end}
.stat.right .stat-v b{font-size:19px}
.fev{display:flex;align-items:center;gap:8px;margin-top:2px}
.fev-bar{width:78px;height:6px;border-radius:3px;background:rgba(180,202,220,.2);overflow:hidden}
.fev-bar i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--accent))}
.fev.on .stat-k{color:var(--gold)}
.fev.on .fev-bar i{background:linear-gradient(90deg,#FFF3C2,var(--gold))}
.hearts{display:flex;gap:5px}
.heart{width:17px;height:16px;background:var(--accent);
  clip-path:path('M8.5 15.2 C-3 7.6 1.2 -.4 5.6 1 C7.4 1.6 8.5 3.6 8.5 3.6 C8.5 3.6 9.6 1.6 11.4 1 C15.8 -.4 20 7.6 8.5 15.2Z');
  transition:transform .2s ease,opacity .25s ease}
.heart.gone{opacity:.22;transform:scale(.8)}

#combo{
  position:absolute;left:50%;top:var(--top);
  display:flex;align-items:center;gap:9px;padding:6px 14px 6px 13px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(9px);
  font-family:var(--font-num);font-weight:700;font-size:18px;
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,1.6,.4,1);
  opacity:0;transform:translate(-50%,-8px) scale(.72);
}
#combo.on{opacity:1;transform:translate(-50%,0) scale(1)}
#combo b{color:var(--mint);font-variant-numeric:tabular-nums}
.combo-bar{width:64px;height:4px;border-radius:2px;background:rgba(180,202,220,.22);overflow:hidden}
.combo-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transform-origin:left}
#mid-huds{
  position:absolute;left:50%;top:calc(var(--top) + 46px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
}
#ballhud,#divehud{
  display:none;align-items:center;gap:9px;padding:5px 13px;border-radius:999px;white-space:nowrap;
  background:var(--glass);border:1px solid rgba(255,201,74,.45);backdrop-filter:blur(9px);
  font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:600;
}
#divehud{border-color:rgba(169,221,242,.42);color:#A9DDF2}
#ballhud.on,#divehud.on{display:flex}
.wob{width:58px;height:5px;border-radius:3px;background:rgba(255,201,74,.2);overflow:hidden}
.wob i{display:block;height:100%;width:0%;background:var(--gold);border-radius:3px}
.wob.warn i{background:var(--danger)}
#divehud .wob{background:rgba(169,221,242,.2)}
#divehud .wob i{background:linear-gradient(90deg,#A9DDF2,var(--mint));width:100%}
#toast{
  position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--font-display);font-size:clamp(26px,6.4vw,42px);letter-spacing:.08em;
  text-shadow:0 2px 0 rgba(8,19,31,.6),0 0 14px rgba(8,19,31,.7),0 4px 30px rgba(4,10,18,.8);opacity:0;
  transition:opacity .5s ease,letter-spacing 1.8s cubic-bezier(.2,.7,.2,1);
}
#toast.on{opacity:1;letter-spacing:.2em}
#toast.hot{color:var(--gold)}
.hud-bl{
  position:absolute;left:var(--gut-l);bottom:var(--bot);display:flex;align-items:center;gap:9px;
  font-size:12px;color:var(--ice-dim);letter-spacing:.06em;white-space:nowrap;
  padding:6px 14px;border-radius:999px;
}
.hud-bl b{font-family:var(--font-num);font-size:15px;color:var(--ice);font-variant-numeric:tabular-nums}
.hud-bl .biome{color:var(--ice);font-weight:600}
.hud-bl .biome.water{color:#A9DDF2}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ice-dim);opacity:.6}
#hint{
  position:absolute;left:50%;bottom:calc(var(--bot) + 44px);transform:translateX(-50%);
  max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11.5px;color:var(--ice);letter-spacing:.05em;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  backdrop-filter:blur(9px);transition:opacity .8s ease;
}
#hint.fade{opacity:0}
#jumpbtn{
  position:fixed;z-index:9;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));
  width:78px;height:78px;border-radius:50%;border:1px solid rgba(180,202,220,.36);
  background:rgba(8,19,31,.6);color:var(--ice);font-size:13px;font-weight:600;letter-spacing:.08em;
  backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;touch-action:none;
}
#jumpbtn.press{transform:scale(.92);background:rgba(255,122,69,.4)}
.hud-actions{
  position:fixed;z-index:9;right:var(--gut-r);bottom:var(--bot);
  display:none;align-items:center;gap:8px;
}
.hud-actions.show{display:flex}
.hud-act{
  padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  color:var(--ice-dim);font-size:11.5px;letter-spacing:.08em;backdrop-filter:blur(9px);cursor:pointer;
  transition:border-color .15s ease,color .15s ease;
}
.hud-act:hover{border-color:rgba(180,202,220,.55);color:var(--ice)}
#jumpbtn.show{display:flex}

/* ---------- 飘字 ---------- */
.pop{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--font-num);font-weight:700;font-size:19px;color:var(--gold);
  text-shadow:0 2px 12px rgba(4,10,18,.85);white-space:nowrap;
  animation:pop .8s cubic-bezier(.15,.9,.3,1) forwards;
}
.pop.good{color:var(--mint);font-size:22px}
.pop.bad{color:var(--danger)}
.pop.water{color:#A9DDF2;font-size:21px}
.pop.chat{
  font-family:var(--font-ui);font-weight:600;font-size:13px;letter-spacing:.04em;
  color:var(--ice);background:rgba(10,24,38,.78);border:1px solid rgba(180,202,220,.32);
  padding:5px 12px;border-radius:999px;backdrop-filter:blur(8px);
  animation:pop 1.15s cubic-bezier(.15,.9,.3,1) forwards;
}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-95%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-210%) scale(.92)}
}

/* ---------- 菜单 ---------- */
#screens{position:fixed;inset:0;z-index:20;display:none}
#screens.on{display:block}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l);
  background:radial-gradient(120% 90% at 50% 34%,rgba(8,19,31,.42) 0%,rgba(8,19,31,.78) 62%,rgba(8,19,31,.93) 100%);
  backdrop-filter:blur(6px);
}
.screen.on{display:flex}
.wrap{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}

#scr-start{
  backdrop-filter:none;padding-left:max(6vw,16px);cursor:pointer;
  background:linear-gradient(90deg,rgba(8,19,31,.92) 0%,rgba(8,19,31,.7) 30%,rgba(8,19,31,0) 64%);
}
#scr-start .wrap{margin:auto 0;align-items:flex-start;text-align:left;cursor:default}
.skin-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:7px 9px 7px 14px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);
}
.skin-meta{display:flex;align-items:baseline;gap:7px;min-width:0}
.skin-lbl{font-size:11px;letter-spacing:.14em;color:var(--ice-dim);font-weight:600}
.skin-name{font-size:12.5px;color:var(--ice);font-weight:600;letter-spacing:.04em}
.skin-list{display:flex;align-items:center;gap:5px}
.skin-chip{
  width:38px;height:30px;padding:0;border-radius:10px;
  border:1px solid transparent;background:rgba(242,248,252,.04);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.skin-chip svg{width:28px;height:22px;display:block;overflow:visible}
.skin-chip:hover{transform:translateY(-1.5px);background:rgba(242,248,252,.09);border-color:rgba(180,202,220,.32)}
.skin-chip[aria-pressed="true"]{
  border-color:var(--mint);background:rgba(14,54,66,.78);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 10px rgba(95,224,190,.16);
}
@media (max-aspect-ratio:115/100){
  #scr-start{
    padding-left:var(--gut-l);
    background:linear-gradient(180deg,rgba(8,19,31,0) 30%,rgba(8,19,31,.78) 50%,rgba(8,19,31,.96) 100%);
  }
  #scr-start .wrap{margin:auto auto 0;align-items:center;text-align:center}
}

.eyebrow{font-size:11px;letter-spacing:.34em;color:var(--ice-dim);font-weight:600;margin:0}
h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(46px,13vw,72px);line-height:1;
  margin:0;letter-spacing:.02em;text-wrap:balance;
  background:linear-gradient(176deg,#FFFFFF 24%,#A9DDF2 68%,#5FE0BE 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(95,224,190,.2));
}
h2{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{margin:0;font-size:14.5px;line-height:1.75;color:var(--ice-dim);max-width:32ch;text-wrap:pretty}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode{
  display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;
  padding:13px 14px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);color:var(--ice);cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.mode:hover{border-color:rgba(95,224,190,.55);transform:translateY(-2px)}
.mode[aria-pressed="true"]{border-color:var(--mint);background:rgba(14,48,60,.82)}
.mode b{font-family:var(--font-display);font-size:21px;font-weight:400;letter-spacing:.06em}
.mode span{font-size:11.5px;color:var(--ice-dim);line-height:1.5}
.go{
  width:100%;padding:14px;border-radius:16px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#FF9A5E,var(--accent));color:#2A1004;
  font-family:var(--font-display);font-size:23px;letter-spacing:.14em;
  box-shadow:0 12px 30px rgba(255,122,69,.3);transition:transform .14s ease,filter .14s ease;
}
.go:hover{transform:translateY(-2px);filter:brightness(1.06)}
.go:active{transform:translateY(0)}
.controls{margin:0;font-size:11.5px;color:var(--ice-dim);line-height:1.75;letter-spacing:.02em}
.best{margin:0;font-size:12px;color:var(--ice-dim);letter-spacing:.06em}
.best b{font-family:var(--font-num);font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.btns button{
  padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  color:var(--ice);font-family:var(--font-display);font-size:19px;letter-spacing:.08em;cursor:pointer;
  transition:transform .14s ease,border-color .14s ease;
}
.btns button:hover{border-color:rgba(180,202,220,.55);transform:translateY(-2px)}
.btns .primary{background:linear-gradient(180deg,#FF9A5E,var(--accent));color:#2A1004;border-color:transparent;box-shadow:0 12px 30px rgba(255,122,69,.28)}
.btns .wide{grid-column:1/-1;font-family:var(--font-ui);font-size:12.5px;letter-spacing:.1em;color:var(--ice-dim);padding:10px}
.rows{width:100%;display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;background:rgba(10,24,38,.78)}
.row span{font-size:12.5px;color:var(--ice-dim);letter-spacing:.06em}
.row b{font-family:var(--font-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.row b.hot{color:var(--gold)}
.rec{margin:0;font-size:12.5px;letter-spacing:.12em;color:var(--mint);font-weight:600;min-height:1.3em}
.keyhint{margin:0;font-size:11.5px;color:var(--ice-dim);letter-spacing:.06em}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

#boot{
  position:fixed;inset:0;z-index:30;background:var(--deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .6s ease;
}
#boot .nm{font-family:var(--font-display);font-size:32px;letter-spacing:.08em;color:var(--ice)}
#boot .ln{width:150px;height:3px;border-radius:2px;background:rgba(180,202,220,.16);overflow:hidden}
#boot .ln i{display:block;width:36%;height:100%;background:var(--mint);border-radius:2px;animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
#boot.done{opacity:0;pointer-events:none}
#boot .err{display:none;font-size:13px;color:var(--ice-dim);line-height:1.7;max-width:32ch;text-align:center;padding:0 16px}
#boot.failed .ln{display:none}
#boot.failed .err{display:block}
@media (max-height:540px){.lede,.controls{display:none}.wrap{gap:11px}h1{font-size:44px}}
@media (max-width:420px){.stat-v b{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.05s!important}}
</style>

<canvas id="gl"></canvas>
<div id="glow" aria-hidden="true"></div>
<div id="uwtint" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="popups" aria-hidden="true"></div>

<div id="hud" class="off" aria-hidden="true">
  <div class="hud-tl">
    <div class="stat"><span class="stat-k">距离</span><span class="stat-v"><b id="ui-dist">0</b><i>m</i></span></div>
    <div class="stat score"><span class="stat-k">得分</span><span class="stat-v"><b id="ui-score">0</b></span></div>
    <div class="fev" id="ui-fev"><span class="stat-k">狂热</span><span class="fev-bar"><i></i></span></div>
  </div>
  <div class="hud-tr">
    <div class="stat right"><span class="stat-k">最高</span><span class="stat-v"><b id="ui-best">0</b></span></div>
    <div class="hearts" id="ui-hearts"></div>
  </div>
  <div id="combo"><b>×2</b><span class="combo-bar"><i></i></span></div>
  <div id="mid-huds">
    <div id="ballhud">金球平衡 <span class="wob" id="ui-wob"><i></i></span></div>
    <div id="divehud">水下潜泳 <span class="wob" id="ui-dive"><i></i></span></div>
  </div>
  <div id="toast"></div>
  <div class="hud-bl"><span class="biome" id="ui-biome">极地晴日</span><span class="dot"></span><span><b id="ui-spd">0</b> km/h</span></div>
  <div id="hint">A / D 转向 · 空格 跳 · 空中再按或 S 砸地/潜泳</div>
</div>

<button id="jumpbtn" aria-label="跳跃">跳</button>
<div class="hud-actions" id="hud-actions">
  <button class="hud-act" id="mutebtn" aria-label="静音">声音：开</button>
  <button class="hud-act" id="pausebtn" aria-label="暂停">暂停</button>
</div>

<div id="screens">
  <div class="screen on" id="scr-start">
    <div class="wrap">
      <p class="eyebrow">3D 无尽雪坡与冰海滑行</p>
      <h1>海豹冲冲冲</h1>
      <p class="lede">肚皮贴雪往下冲，跃入冰海畅游。攒满狂热撞碎冰晶，空中再按可砸地或潜泳。</p>
      <div class="skin-bar" aria-label="海豹装扮">
        <div class="skin-meta"><span class="skin-lbl">装扮</span><span class="skin-name" id="skin-name">暖橙</span></div>
        <div class="skin-list" id="skin-dots"></div>
      </div>
      <div class="modes">
        <button class="mode" id="mode-rush" data-mode="rush" aria-pressed="true"><b>冲刺</b><span>冰晶、雪球、浮冰与暗礁，3 颗心</span></button>
        <button class="mode" id="mode-zen" data-mode="zen" aria-pressed="false"><b>禅意</b><span>没有障碍，只有雪、冰海、小鱼和极光</span></button>
      </div>
      <button class="go" id="btn-go">开始下滑</button>
      <p class="controls" id="ctl-text">A / D 或 ← → 转向，空格跳跃 / 破水，空中再按或 S 砸地 / 潜泳<br>擦边过障有奖励，M 键静音 · 轻点海豹可互动</p>
      <p class="best">最高分 <b id="ui-best2">0</b></p>
    </div>
  </div>

  <div class="screen" id="scr-over">
    <div class="wrap">
      <p class="eyebrow" id="o-eyebrow">这一趟</p>
      <h2 id="o-title">海豹晕乎乎</h2>

/* ============================================================
   0. 小工具
   ============================================================ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);
const damp  = (a,b,l,dt)=> lerp(a,b,1-Math.exp(-l*dt));
const wrap  = (v,c,h)=> c + ((((v-c+h)%(2*h))+2*h)%(2*h)) - h;
const TAU = Math.PI*2;
const wrapPi = a=> Math.atan2(Math.sin(a),Math.cos(a));
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function segDist2(x0,z0,x1,z1,px,pz){
  const dx=x1-x0, dz=z1-z0, l2=dx*dx+dz*dz;
  if(l2<1e-6) return (px-x0)*(px-x0)+(pz-z0)*(pz-z0);
  const t=clamp(((px-x0)*dx+(pz-z0)*dz)/l2,0,1);
  const cx=x0+dx*t-px, cz=z0+dz*t-pz;
  return cx*cx+cz*cz;
}

/* ============================================================
   1. 地形与冰海水道数学
   高度是纯函数 surfaceY(x,z)。雪坡 3 种与水道 3 种几何体均在启动时缓存，永不重建。
   ============================================================ */
const CHUNK_LEN = 70, VARIANTS = 3, PHASES = [0, 2.17, 4.41];
const TRACK_HALF = 11, GRADE = 0.105, BANK_H = 9, GRAV = 34;
const WATER_DEPTH = 4.3, WATER_OFF = -0.55;
const LANES = [-8.6,-5.2,-1.75,1.75,5.2,8.6];

const chunkK    = z => Math.ceil(z/CHUNK_LEN);
const variantOf = k => ((k%VARIANTS)+VARIANTS)%VARIANTS;
function waterRole(k){
  if(k > -4) return 'snow';
  const n = -k - 4, cycle = Math.floor(n/8), step = n%8, midLen = cycle>=2 ? 2 : 1;
  if(step === 0) return 'entry';
  if(step <= midLen) return 'mid';
  if(step === midLen + 1) return 'exit';
  return 'snow';
}
function carveZ(role, lz){
  if(role === 'mid') return 1;
  if(role === 'entry') return smooth(clamp((-lz - 10)/24, 0, 1));
  if(role === 'exit')  return 1 - smooth(clamp((-lz - 36)/24, 0, 1));
  return 0;
}
function channelX(x){
  return 1 - smooth(clamp((Math.abs(x) - (TRACK_HALF + 0.2))/4.2, 0, 1));
}
// 基础项沿 z 的周期等于区块长度；带相位的变化项乘上在区块两端归零的窗函数，
// 所以相邻区块（哪怕变体或雪/水过渡不同）在接缝处的高度和坡度都严格一致。
const pnoise = (x,lz,ph)=>{
  const w = TAU/CHUNK_LEN, win = Math.sin(Math.PI*lz/CHUNK_LEN);
  return 0.34*Math.sin(x*0.16 + w*2*lz)
       + 0.20*Math.sin(w*3*lz - x*0.10 + 1.3)
       + win*win*(0.30*Math.sin(x*0.21 + w*2*lz + ph) + 0.16*Math.sin(x*0.52 + w*5*lz + ph*2.3));
};
function bankAt(x){
  const a = Math.abs(x);
  return a<=TRACK_HALF ? 0 : smooth(clamp((a-TRACK_HALF)/24,0,1))*BANK_H;
}
function chunkLocalY(x,lz,ph,role){
  const cv = carveZ(role,lz) * channelX(x);
  return GRADE*lz + bankAt(x) + pnoise(x,lz,ph)*(1 - 0.65*cv) - WATER_DEPTH*cv;
}
function surfaceY(x,z){
  const k = chunkK(z), role = waterRole(k), ph = role==='snow' ? PHASES[variantOf(k)] : 0;
  return GRADE*k*CHUNK_LEN + chunkLocalY(x, z-k*CHUNK_LEN, ph, role);
}
function waterAt(x,z){
  const k = chunkK(z), role = waterRole(k);
  if(role==='snow') return {inPool:false, waterY:-1e9, depth:0};
  const wy = GRADE*z + WATER_OFF, gy = surfaceY(x,z), depth = wy - gy;
  return {inPool: depth > 0.45, waterY: wy, depth};
}
const slopeAt = (x,z)=> Math.atan((surfaceY(x,z-1)-surfaceY(x,z+1))*0.5);

function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c,c.getContext('2d')]; }

function radial(size,stops){
  const [c,g]=cv(size,size), h=size/2, gr=g.createRadialGradient(h,h,0,h,h,h);
  for(const s of stops) gr.addColorStop(s[0],'rgba(255,255,255,'+s[1]+')');
  g.fillStyle=gr; g.fillRect(0,0,size,size); return tex(c);
}

    gr.addColorStop(0,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');

const TEX_AURORA = (()=>{                     // 竖向光幕：底部亮绿，向上褪成紫色
  const [c,g]=cv(512,128), r=mulberry32(77);

    gr.addColorStop(1,'rgba(95,235,190,0)');

})();
const TEX_PAD = (()=>{                        // 加速带：向前滚动的箭头

})();
const [TEX_WATER, TEX_WATER_NRM] = (()=>{        // 无缝周期水波纹贴图与法线贴图
  const N = 128, h = new Float32Array(N*N);
  for(let y=0;y<N;y++){
    const v = y/N;
    for(let x=0;x<N;x++){
      const u = x/N;
      h[y*N+x] = 0.36*Math.sin(TAU*(2*u+3*v))
               + 0.30*Math.cos(TAU*(-3*u+4*v+0.28))
               + 0.22*Math.sin(TAU*(5*u-2*v+0.64))
               + 0.14*Math.cos(TAU*(1*u+7*v+0.12));
    }
  }
  const [cC, gC] = cv(N,N), imgC = gC.createImageData(N,N), dC = imgC.data;
  const [cN, gN] = cv(N,N), imgN = gN.createImageData(N,N), dN = imgN.data;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i = y*N+x, o = i*4;
    const ridge = Math.pow(clamp(0.52 + 0.48*h[i], 0, 1), 2.6);
    dC[o]   = Math.round(lerp(212, 255, ridge));
    dC[o+1] = Math.round(lerp(238, 255, ridge));
    dC[o+2] = Math.round(lerp(248, 255, ridge));
    dC[o+3] = 255;
    const hx = h[y*N + ((x+1)%N)] - h[y*N + ((x+N-1)%N)];
    const hy = h[((y+1)%N)*N + x] - h[((y+N-1)%N)*N + x];
    const nx = -hx*0.75, ny = -hy*0.75, il = 1/Math.hypot(nx, ny, 1);
    dN[o]   = Math.round(128 + 127*nx*il);
    dN[o+1] = Math.round(128 + 127*ny*il);
    dN[o+2] = Math.round(128 + 127*il);
    dN[o+3] = 255;
  }
  gC.putImageData(imgC,0,0); gN.putImageData(imgN,0,0);
  const tC = tex(cC); tC.wrapS = tC.wrapT = THREE.RepeatWrapping; tC.repeat.set(3,5);
  const tN = new THREE.CanvasTexture(cN); tN.wrapS = tN.wrapT = THREE.RepeatWrapping; tN.repeat.set(3,5);
  return [tC, tN];
})();
const TEX_DROP = radial(64, [[0,1],[.26,.92],[.50,.32],[.74,0]]);
const TEX_BUBBLE = (()=>{                       // 清透中空水泡：细亮圈 + 左上高光
  const [c,g]=cv(64,64);

   ============================================================ */
function TRS(px,py,pz, sx=1,sy=1,sz=1, rx=0,ry=0,rz=0){
  return new THREE.Matrix4().compose(V3(px,py,pz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)), V3(sx,sy,sz));
}
// 把若干 [几何体, 颜色, 矩阵] 合成一个带顶点色的几何体，一个小模型只占一次绘制
function merge(parts){
  const P=[],N=[],C=[], c=new THREE.Color();
  for(const [geo,col,mat] of parts){
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if(mat) g.applyMatrix4(mat);
    c.set(col);
    const p=g.attributes.position.array, n=g.attributes.normal.array;
    for(let i=0;i<p.length;i+=3){ P.push(p[i],p[i+1],p[i+2]); N.push(n[i],n[i+1],n[i+2]); C.push(c.r,c.g,c.b); }
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(N,3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(C,3));
  return out;
}

function makeChunkGeometry(variant, role='snow'){
  const ph = role==='snow' ? PHASES[variant] : 0;
  const XS=[];
  { const left=[]; let step=2.2, x=-TRACK_HALF;
    while(x>-160){ x-=step; step*=1.24; left.push(x); }
    left.reverse(); for(const v of left) XS.push(v);
    for(let v=-TRACK_HALF; v<=TRACK_HALF+1e-6; v+=1.375) XS.push(v);
    step=2.2; x=TRACK_HALF;
    while(x<160){ x+=step; step*=1.24; XS.push(x); } }
  const W=XS.length, ZN=34, dz=CHUNK_LEN/(ZN-1);
  const hAt=(xx,lz)=> chunkLocalY(xx,lz,ph,role);
  const cLow=new THREE.Color('#7F97B6'), cHigh=new THREE.Color('#FFFFFF'), cBank=new THREE.Color('#9DB2C8');
  const cShore=new THREE.Color('#CBEBF5'), cBed=new THREE.Color('#103F5C'), tmp=new THREE.Color();
  const pos=new Float32Array(W*ZN*3), col=new Float32Array(W*ZN*3), nrm=new Float32Array(W*ZN*3);
  let p=0;
  for(let j=0;j<ZN;j++){
    const lz=-j*dz;
    for(let i=0;i<W;i++){
      const xx=XS[i], yy=hAt(xx,lz), cv=carveZ(role,lz)*channelX(xx);
      pos[p]=xx; pos[p+1]=yy; pos[p+2]=lz;
      tmp.copy(cLow).lerp(cHigh, clamp(0.55+pnoise(xx,lz,ph)*0.9,0,1));
      tmp.lerp(cBank, clamp(bankAt(xx)/BANK_H,0,1)*0.3);
      if(cv>0.01){
        tmp.lerp(cShore, smooth(clamp(cv*2.2,0,1))*0.75);
        tmp.lerp(cBed, smooth(clamp((cv-0.3)/0.7,0,1)));
      }
      col[p]=tmp.r; col[p+1]=tmp.g; col[p+2]=tmp.b;
      // 解析法线：直接对高度函数求差分，接缝两侧的光照因此连续
      const e=0.25, nx=-(hAt(xx+e,lz)-hAt(xx-e,lz))/(2*e), nz=-(hAt(xx,lz+e)-hAt(xx,lz-e))/(2*e), il=1/Math.hypot(nx,1,nz);
      nrm[p]=nx*il; nrm[p+1]=il; nrm[p+2]=nz*il;
      p+=3;
    }
  }
  const idx=[];
  for(let j=0;j<ZN-1;j++) for(let i=0;i<W-1;i++){
    const a=j*W+i, b=a+1, c=a+W, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setIndex(idx);
  return g;
}
function makeWaterSurfaceGeo(role){
  const z0 = role==='entry' ? -10 : 0;
  const z1 = role==='exit'  ? -56 : -CHUNK_LEN;
  const XN=28, ZN=36, hw=15.2;
  const pos=new Float32Array(XN*ZN*3), col=new Float32Array(XN*ZN*4), uv=new Float32Array(XN*ZN*2);
  const cShore=new THREE.Color('#F2FAFF'), cShallow=new THREE.Color('#58C4DF'), cDeep=new THREE.Color('#17648A'), tmp=new THREE.Color();
  let p=0, c=0, u=0;
  for(let j=0;j<ZN;j++){
    const tz=j/(ZN-1), lz=lerp(z0,z1,tz);
    const zFade = role==='entry' ? smooth(clamp((-lz-11)/11,0,1))
                : role==='exit'  ? (1-smooth(clamp((-lz-38)/13,0,1))) : 1;
    for(let i=0;i<XN;i++){
      const tx=i/(XN-1), xx=lerp(-hw,hw,tx);
      const surfY=GRADE*lz+WATER_OFF, bedY=chunkLocalY(xx,lz,0,role), depth=surfY-bedY;
      const wave=0.04*Math.sin(xx*0.42+(lz/CHUNK_LEN)*TAU*3)*smooth(clamp(depth/1.2,0,1));
      const tuck=depth<-0.08 ? -smooth(clamp((-depth-0.08)/0.55,0,1))*0.42 : 0;
      pos[p]=xx; pos[p+1]=surfY+wave+tuck; pos[p+2]=lz;
      uv[u]=tx*2; uv[u+1]=-lz/18;
      const tFoam=1-smooth(clamp(depth/0.85,0,1)), tDeep=smooth(clamp((depth-0.35)/2.6,0,1));
      tmp.copy(cShallow).lerp(cDeep,tDeep).lerp(cShore,tFoam*0.90);
      const al=smooth(clamp((depth+0.02)/0.52,0,1))*zFade*0.86;
      col[c]=tmp.r; col[c+1]=tmp.g; col[c+2]=tmp.b; col[c+3]=al;
      p+=3; c+=4; u+=2;
    }
  }
  const idx=[];
  for(let j=0;j<ZN-1;j++) for(let i=0;i<XN-1;i++){
    const a=j*XN+i, b=a+1, c=a+XN, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,4));
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function shell(geo, mat, t){                   // 实体 + 沿法线外扩的背面描边
  const m = new THREE.Mesh(geo, mat); m.castShadow = true;

function weld(g){                              // 变形后重算法线，并抹平球面接缝
  g.computeVertexNormals();
  const p=g.attributes.position, n=g.attributes.normal, map=new Map();
  for(let i=0;i<p.count;i++){
    const k=Math.round(p.getX(i)*1e3)+','+Math.round(p.getY(i)*1e3)+','+Math.round(p.getZ(i)*1e3);
    let a=map.get(k); if(!a){ a=[0,0,0,[]]; map.set(k,a); }

function sealBodyGeo(){

  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const t=(z+1)/2, k=1-0.66*smooth(clamp((t-0.40)/0.60,0,1));         // 往尾巴收窄

function onHead(yaw,pitch,out=1){ const cp=Math.cos(pitch); return V3(HA[0]*Math.sin(yaw)*cp*out, HA[1]*Math.sin(pitch)*out, -HA[2]*Math.cos(yaw)*cp*out); }

function animateSeal(dt,t){

    const baseY = Math.abs(w)<1.9 ? clamp(w,-0.95,0.95) : 0;
    if(attractLook.timer>0){

      ty = clamp(baseY + attractLook.yaw, -1.05, 1.05);

const RING_SEG = 40, rings = []; let ringI = 0;
for(let i=0;i<10;i++){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((RING_SEG+1)*6),3));
  const idx=[]; for(let s=0;s<RING_SEG;s++){ const a=s*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  g.setIndex(idx);
  const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide,
    polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3}));
  m.visible=false; m.frustumCulled=false; m.userData={t:1,R:1,dur:0.5,x:0,z:0,op:0.7,thin:0}; scene.add(m); rings.push(m);
}
function ring(x,y,z,R,color,dur,op,thin){
  const m=rings[ringI]; ringI=(ringI+1)%rings.length;
  m.material.color.setHex(color); m.material.opacity=0;
  Object.assign(m.userData,{t:0,R,dur:dur||0.45,x,z,op:op||0.7,thin:thin?1:0}); m.visible=true;
}
function updateRings(dt){

    if(u.t>=1){ m.visible=false; continue; }
    u.z -= S.speed*(u.thin?0.25:0.7)*dt;
    const ro=(u.thin?0.7:0.3)+(1-Math.pow(1-u.t,3))*u.R;
    const ri=ro*(u.thin?(0.85+0.11*u.t):(0.74+0.2*u.t)), p=m.geometry.attributes.position.array;
    const hRing=(xx,zz)=>{ const w=waterAt(xx,zz); return (w.inPool ? w.waterY : surfaceY(xx,zz))+(u.thin?0.06:0.1); };
    for(let s=0;s<=RING_SEG;s++){
      const a=s/RING_SEG*TAU, c=Math.cos(a), sn=Math.sin(a), o=s*6;
      let x=u.x+c*ri, z=u.z+sn*ri; p[o]=x; p[o+1]=hRing(x,z); p[o+2]=z;
      x=u.x+c*ro; z=u.z+sn*ro; p[o+3]=x; p[o+4]=hRing(x,z); p[o+5]=z;

// 滑痕 / 人字形水波尾迹：雪上留单道弧痕，水中自然张开双翼开尔文波
const TR = 120, TR_COLS = 6;
const TW_SNOW  = [-0.82,-0.46,-0.16,0.16,0.46,0.82];
const TW_WATER = [-1.45,-0.92,-0.40,0.40,0.92,1.45];
const trail = { x:new Float32Array(TR), z:new Float32Array(TR), yl:new Float32Array(TR), yr:new Float32Array(TR),
                a:new Float32Array(TR), w:new Uint8Array(TR), head:0, n:0, lastZ:1e9 };
const trailPos = new Float32Array(TR*TR_COLS*3), trailCol = new Float32Array(TR*TR_COLS*4).fill(1);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol,4));
{ const idx=[];
  for(let i=0;i<TR-1;i++) for(let s=0;s<TR_COLS-1;s++){ const a=i*TR_COLS+s, b=a+1, c=a+TR_COLS, d=c+1; idx.push(a,c,d, a,d,b); }
  trailGeo.setIndex(idx); }
const trailMat = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true, depthWrite:false, side:THREE.DoubleSide,
  polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2});
const trailMesh = new THREE.Mesh(trailGeo, trailMat); trailMesh.frustumCulled=false; trailMesh.renderOrder=3; scene.add(trailMesh);
const TRAIL_DAY = new THREE.Color('#6C8DB8'), TRAIL_NIGHT = new THREE.Color('#5FE0BE'),
      TRAIL_FEVER = new THREE.Color('#FFB93C'), TRAIL_WATER = new THREE.Color('#EBF9FF'), _tCol = new THREE.Color();
function pushTrail(x,z,alpha,isW){
  if(Math.abs(z-trail.lastZ) < 0.45) return;
  trail.lastZ = z;
  const i = trail.head; trail.head = (trail.head+1)%TR; trail.n = Math.min(trail.n+1, TR);
  trail.x[i]=x; trail.z[i]=z; trail.a[i]=alpha; trail.w[i]=isW?1:0;
  if(isW){
    const wy = GRADE*z + WATER_OFF + 0.04;
    trail.yl[i]=wy; trail.yr[i]=wy;
  }else{
    trail.yl[i]=surfaceY(x-0.82,z)+0.05; trail.yr[i]=surfaceY(x+0.82,z)+0.05;
  }
}
function updateTrail(){
  let last=0;
  for(let i=0;i<TR;i++){
    const live = i<trail.n, j = live ? (trail.head-1-i+TR*2)%TR : last;
    if(live) last=j;
    const isW = live && trail.w[j]===1;
    const fade = 1 - i/TR;
    const al = live ? trail.a[j]*fade*(S.fever>0?0.58:(isW?0.62:0.30)) : 0;
    if(S.fever>0) _tCol.copy(TRAIL_FEVER);
    else if(isW) _tCol.copy(TRAIL_WATER);
    else _tCol.copy(TRAIL_DAY).lerp(TRAIL_NIGHT, cur.star);
    const sp = isW ? 1 + (i/TR)*2.15 : 1;
    for(let s=0;s<TR_COLS;s++){
      const o=(i*TR_COLS+s)*3, q=(i*TR_COLS+s)*4;
      const baseOff = isW ? TW_WATER[s] : TW_SNOW[s];
      trailPos[o] = trail.x[j] + baseOff*sp;
      const baseY = lerp(trail.yl[j], trail.yr[j], (baseOff+0.82)/1.64);
      trailPos[o+1] = isW ? (trail.yl[j]+((s===1||s===4)?0.025:0)) : baseY;
      trailPos[o+2] = trail.z[j];
      trailCol[q]=_tCol.r; trailCol[q+1]=_tCol.g; trailCol[q+2]=_tCol.b;
      trailCol[q+3] = isW ? ((s===1||s===4)?al*0.72:(s===2||s===3)?al*0.10:0) : ((s>=1&&s<=4)?al:0);
    }
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
}

/* ============================================================
   8. 程序化音效与配乐（Web Audio，没有任何音频文件）
   ============================================================ */
const PENTA = [0,2,4,7,9];
const CHORDS = [[0,4,7],[9,12,16],[5,9,12],[7,11,14]], ARP = [0,1,2,1,0,2,1,2];
const Snd = {
  ac:null, ready:false, muted: store.get('sealrush.mute','0')==='1', padTarget:0.05, bell:4, nextT:0, stepI:0,
  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    try{ this.ac = new AC(); }catch(e){ return; }
    const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = this.muted?0:0.85; this.master.connect(ac.destination);
    this.musLP = ac.createBiquadFilter(); this.musLP.type='lowpass'; this.musLP.frequency.value=18000; this.musLP.Q.value=0.7;
    this.musLP.connect(this.master);
    this.mus = ac.createGain(); this.mus.gain.value = 0.9; this.mus.connect(this.musLP);
    const len = Math.floor(ac.sampleRate*2), buf = ac.createBuffer(1,len,ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noise = buf;
    const src = ac.createBufferSource(); src.buffer=buf; src.loop=true;
    this.windLP = ac.createBiquadFilter(); this.windLP.type='lowpass'; this.windLP.frequency.value=380; this.windLP.Q.value=0.7;
    this.windGain = ac.createGain(); this.windGain.gain.value=0;
    src.connect(this.windLP); this.windLP.connect(this.windGain); this.windGain.connect(this.master); src.start();
    const plp = ac.createBiquadFilter(); plp.type='lowpass'; plp.frequency.value=700; plp.Q.value=0.5;
    this.padGain = ac.createGain(); this.padGain.gain.value=0; plp.connect(this.padGain); this.padGain.connect(this.master);
    [110,164.81,196].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type = i===0?'sine':'triangle'; o.frequency.value=f;
      const g=ac.createGain(); g.gain.value = i===0?0.5:0.22; o.connect(g); g.connect(plp); o.start();
    });
    this.ready = true;
  },
  setMuted(m){ this.muted=m; store.set('sealrush.mute', m?'1':'0'); if(this.ready) this.master.gain.value = m?0:0.85; },
  env(node,t,a,d,peak,dest){
    const g=this.ac.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
    node.connect(g); g.connect(dest||this.master);
  },
  tone(freq,t,a,d,peak,type,dest){
    const o=this.ac.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    this.env(o,t,a,d,peak,dest); o.start(t); o.stop(t+a+d+0.03); return o;
  },
  hiss(t,f0,f1,dur,peak,q,dest){
    const s=this.ac.createBufferSource(); s.buffer=this.noise; s.loop=true;
    const bp=this.ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    s.connect(bp); this.env(bp,t,0.008,dur,peak,dest); s.start(t); s.stop(t+dur+0.05);
  },
  ok(){ return this.ready && !this.muted && this.ac.state==='running'; },
  sweep(f0,f1,dur,peak,type){ if(!this.ok()) return; const t=this.ac.currentTime; this.tone(f0,t,0.006,dur,peak,type).frequency.exponentialRampToValueAtTime(f1,t+dur); },
  chord(fs,gap,dur,peak){ if(!this.ok()) return; const t=this.ac.currentTime; fs.forEach((f,i)=>this.tone(f,t+i*gap,0.006,dur,peak,'triangle')); },
  coin(combo,gold){            // 连击越高，音越往五声音阶上爬
    if(!this.ok()) return;
    const i=Math.min(combo-1,12), f=523.25*Math.pow(2,(12*Math.floor(i/5)+PENTA[i%5])/12), t=this.ac.currentTime;
    this.tone(f,t,0.004,0.13,0.15,'triangle'); this.tone(f*1.5,t+0.05,0.004,0.16,0.08,'sine');
    if(gold) this.tone(f*2,t+0.1,0.004,0.3,0.1,'triangle');
  },
  jump(){ this.sweep(520,1040,0.1,0.11,'sine'); if(this.ok()) this.hiss(this.ac.currentTime,500,2400,0.22,0.09,0.9); },   // “啾”
  dive(){ this.sweep(980,300,0.2,0.09,'sine'); },
  land(){ this.sweep(150,70,0.16,0.2,'sine'); if(this.ok()) this.hiss(this.ac.currentTime,900,220,0.16,0.1,0.7); },
  slam(){ this.sweep(130,42,0.32,0.34,'sine'); if(this.ok()) this.hiss(this.ac.currentTime,1200,120,0.34,0.26,0.6); },
  splash(big){
    if(!this.ok()) return; const t=this.ac.currentTime;
    this.hiss(t, big?2400:1800, 320, big?0.36:0.24, big?0.28:0.18, 0.85);
    this.tone(big?380:460,t,0.005,0.14,0.11,'sine').frequency.exponentialRampToValueAtTime(140,t+0.14);
  },
  bubble(){
    if(!this.ok()) return; const t=this.ac.currentTime;
    [540,740,980].forEach((f,i)=>this.tone(f,t+i*0.04,0.004,0.09,0.09,'sine').frequency.exponentialRampToValueAtTime(f*1.35,t+i*0.04+0.09));
  },
  chirp(high){

  },

  },
  smash(){ if(!this.ok()) return; const t=this.ac.currentTime; this.hiss(t,5200,1400,0.2,0.2,0.8); this.tone(1568,t,0.003,0.12,0.07,'triangle'); this.tone(2093,t+0.03,0.003,0.16,0.06,'triangle'); },
  near(){ if(this.ok()) this.hiss(this.ac.currentTime,700,3200,0.14,0.08,1.4); },
  hit(){ this.sweep(430,170,0.26,0.2,'triangle'); if(this.ok()) this.hiss(this.ac.currentTime,1400,160,0.3,0.22,0.6); },
  ballCatch(){ this.chord([659.25,880,1174.66],0.075,0.32,0.14); },
  ballDrop(){ this.chord([659.25,523.25,392],0.09,0.26,0.12); },
  pad(){ this.chord([523.25,783.99,1046.5],0.045,0.36,0.11); },
  flip(){ this.chord([783.99,987.77,1174.66,1567.98],0.06,0.34,0.11); },
  fever(){ this.chord([523.25,659.25,783.99,1046.5,1318.5,1567.98],0.055,0.4,0.12); },
  over(){ this.chord([440,349.23,261.63,196],0.14,0.7,0.15); },
  step(t,fever,zen){           // 八分音符琶音 + 根音贝斯，四小节一循环
    const i=this.stepI++, s=i%8, CH=CHORDS[(i>>3)%4];
    const semi=CH[ARP[s]]+((s===3||s===7)?12:0)+(fever?12:0);
    this.tone(261.63*Math.pow(2,semi/12),t,0.005,0.24,0.045,'triangle',this.mus);
    if(s%4===0) this.tone(65.41*Math.pow(2,(CH[0]%12)/12),t,0.01,0.42,0.1,'sine',this.mus);
    if(!zen && s%2===1) this.hiss(t,7000,5000,0.04,0.012,1.2,this.mus);
    if(fever && s%2===0) this.tone(523.25*Math.pow(2,CH[2]/12),t,0.004,0.1,0.022,'square',this.mus);
  },
  frame(dt,v,playing,fever,zen,diving){
    if(!this.ready) return;
    this.windGain.gain.value = damp(this.windGain.gain.value, diving?0.006:(0.014+v*0.002), 3, dt);
    this.windLP.frequency.value = damp(this.windLP.frequency.value, diving?180:(280+v*20), 3, dt);
    this.musLP.frequency.value = damp(this.musLP.frequency.value, diving?680:18000, 6, dt);
    this.padGain.gain.value = damp(this.padGain.gain.value, this.padTarget, 0.8, dt);
    if(!this.ok()) return;
    const now=this.ac.currentTime;

      if(this.nextT<now) this.nextT=now+0.05;

      while(this.nextT<now+0.14){ this.step(this.nextT,fever,zen); this.nextT+=d; }
    }else{
      this.bell-=dt;
      if(this.bell<=0){ this.bell=5+Math.random()*7; const sc=[523.25,587.33,698.46,783.99,880]; this.tone(sc[(Math.random()*sc.length)|0],now,0.35,3.4,0.03,'sine'); }
    }
  },
  suspend(){ if(this.ready && this.ac.state==='running') this.ac.suspend(); },
  resume(){ if(this.ready && this.ac.state==='suspended') this.ac.resume(); }
};

const chunks = new Map(), groundPool = [], waterPool = [];
const AHEAD = 7, BEHIND = 5;          // 身后也留够长：标题页的镜头是回头看的
let chunksDirty = true, fishList = [], pengList = [], floeList = [], wringList = [], sballList = [];

function blockedZone(c,x,z){            // 跳台的起落通道、加速带附近不放障碍
  for(const r of c.ramps) if(Math.abs(x-r.x)<4.4 && z<r.z+10 && z>r.z-r.len-56) return true;
  const prev = chunks.get(c.k+1);
  if(prev) for(const r of prev.ramps) if(Math.abs(x-r.x)<4.4 && z<r.z+10 && z>r.z-r.len-56) return true;
  for(const p of c.pads)  if(Math.abs(x-p.x)<3.2 && Math.abs(z-p.z)<7) return true;
  return false;
}
function makeChunk(k){
  const L=CHUNK_LEN, zTop=k*L, zBot=zTop-L, role=waterRole(k);
  const rnd = mulberry32((Math.imul(k|0,2654435761) ^ S.seed)>>>0);
  const zen = S.mode==='zen';
  const diff = clamp(-zTop/2600,0,1);
  const gz = u=> zTop-u*L, side = ()=> rnd()<0.5?-1:1;

  const ground = groundPool.pop() || (()=>{ const m=new THREE.Mesh(CHUNK_GEOS[0], terrainMat); m.receiveShadow=true; return m; })();
  ground.geometry = role==='snow' ? CHUNK_GEOS[variantOf(k)] : WATER_CHUNK_GEOS[role];
  ground.position.set(0, GRADE*zTop, zTop);
  world.add(ground);

  let waterMesh = null;
  if(role!=='snow'){
    waterMesh = waterPool.pop() || (()=>{ const m=new THREE.Mesh(WATER_SURF_GEOS.mid, waterMat); m.renderOrder=2; return m; })();
    waterMesh.geometry = WATER_SURF_GEOS[role];
    waterMesh.position.set(0, GRADE*zTop, zTop);
    world.add(waterMesh);
  }

  const c = {k,role,zTop,zBot,ground,waterMesh, bergs:[],mounds:[],spires:[],pines:[],snowmen:[],pengs:[],
    rocks:[],pillars:[],ramps:[],pads:[],fish:[],floes:[],reefs:[],wrings:[],snowballs:[]};

  // ---- 布景（都在赛道外）：冰山、雪包、冰晶、雪松、雪人、围观的企鹅 ----
  const bankPad = role==='snow' ? 0 : 2.5;
  for(let i=0,n=2+((rnd()*3)|0); i<n; i++){
    const x=side()*(46+rnd()*85), z=gz(rnd()), s=8+rnd()*16;
    c.bergs.push({x,z,y:surfaceY(x,z)-s*0.2, sx:s, sy:s*(0.7+rnd()*0.9), sz:s*(0.8+rnd()*0.5), ry:rnd()*TAU, rx:(rnd()-0.5)*0.5});
  }
  for(let i=0,n=4+((rnd()*5)|0); i<n; i++){
    const x=side()*(TRACK_HALF+3.8+bankPad+rnd()*28), z=gz(rnd()), s=1.2+rnd()*3;
    c.mounds.push({x,z,y:surfaceY(x,z)-s*0.25, sx:s*1.6, sy:s*0.7, sz:s*1.6, ry:rnd()*TAU});
  }
  for(let i=0,n=1+((rnd()*3)|0); i<n; i++){
    const x=side()*(TRACK_HALF+5+bankPad+rnd()*24), z=gz(rnd());
    c.spires.push({x,z,s:1.3+rnd()*2.2,h:5+rnd()*12,ry:rnd()*TAU});
  }
  for(let i=0,n=5+((rnd()*7)|0); i<n; i++){
    const x=side()*(TRACK_HALF+4.5+bankPad+rnd()*34), z=gz(rnd()), s=0.9+rnd()*1.1;
    c.pines.push({x,z,y:surfaceY(x,z)-0.15,s,h:s*(0.9+rnd()*0.4),ry:rnd()*TAU});
  }
  if(rnd()<0.24){
    const sd=side(), x=sd*(TRACK_HALF+2.2+bankPad+rnd()*2.5), z=gz(rnd());
    c.snowmen.push({x,z,y:surfaceY(x,z)-0.08,s:0.95+rnd()*0.35,ry:-sd*0.8+(rnd()-0.5)*0.4});
  }
  if(rnd()<0.5){
    const sd=side(), z0=gz(0.1+rnd()*0.8), n=1+((rnd()*4)|0);
    for(let i=0;i<n;i++){
      const x=sd*(TRACK_HALF+1.6+bankPad+rnd()*1.4), z=z0-i*(1.1+rnd()*0.5);
      c.pengs.push({x,z,y:surfaceY(x,z)-0.02,s:0.95+rnd()*0.4,ry:-sd*0.9+(rnd()-0.5)*0.5,ph:rnd()*TAU});
    }
  }

  if(role==='snow'){
    // ---- 跳台 + 按实际抛物线对齐的一串鱼 ----
    const nextRole = waterRole(k-1);
    if(k<=-1 && rnd()<0.38 && (nextRole==='snow' || rnd()<0.5)){
      const uMax = nextRole==='snow' ? 0.52 : 0.25;
      const x=LANES[1+((rnd()*4)|0)], z=gz(0.15+rnd()*(uMax-0.15));
      c.ramps.push({x,z,w:2.3,len:5.2,h:1.75});
      const estV=Math.min(56, 20+Math.max(0,-z)*0.014), vyRel=18.0, T=2*vyRel/GRAV;
      for(let i=0;i<5;i++){
        const u=0.16+i*0.16, tF=u*T;
        c.fish.push({x, z:z-5.2-estV*tF, ph:i*0.5, lift:vyRel*tF-0.5*GRAV*tF*tF, gold:false, dead:false, sub:false});
      }
    }
    // ---- 加速带 ----
    if(rnd()<0.32){
      const x=LANES[(rnd()*LANES.length)|0], z=gz(0.15+rnd()*0.7);
      if(!blockedZone(c,x,z)) c.pads.push({x,z,used:false});
    }
    // ---- 障碍：开局 140 米不放，之后随距离变密；每排最多封 3 条道，永远留路 ----
    if(!zen && k<=-2){
      const groups = 1+Math.round(diff*2.5);
      for(let gi=0; gi<groups; gi++){
        const zRow = gz(0.08 + (gi+0.2+rnd()*0.6)/groups*0.86);
        const order=[0,1,2,3,4,5];
        for(let i=5;i>0;i--){ const j=(rnd()*(i+1))|0, t=order[i]; order[i]=order[j]; order[j]=t; }
        const n = 1 + (rnd()<0.25+diff*0.5?1:0) + (rnd()<diff*0.35?1:0);
        for(let bi=0; bi<n; bi++){
          const x=LANES[order[bi]]+(rnd()-0.5)*1.2, z=clamp(zRow+(rnd()-0.5)*7, zBot+3.5, zTop-3.5);
          if(blockedZone(c,x,z)){ rnd(); rnd(); rnd(); continue; }
          if(rnd()<0.5){
            const s=0.9+rnd()*0.5;
            c.pillars.push({x,z,s,h:2.6+rnd()*3.4,ry:rnd()*TAU,r:0.62*s,tall:true,dead:false,passed:false});
          }else{
            const s=0.95+rnd()*0.9;
            c.rocks.push({x,z,y:surfaceY(x,z)-0.35, sx:s*1.15, sy:s*0.95, sz:s*1.15, ry:rnd()*TAU, r:s*0.95, top:s*0.95-0.35, dead:false, passed:false});
          }
        }
      }
      // 700 米后偶尔出现沿坡滚落的大雪球
      if(k<=-10 && rnd()<0.35+diff*0.3){
        const x=LANES[1+((rnd()*4)|0)], z=gz(0.2+rnd()*0.6);
        if(!blockedZone(c,x,z)) c.snowballs.push({x,z,r:1.15,vx:(rnd()-0.5)*5.5,vz:7+rnd()*6,rot:0,dead:false,passed:false});
      }
    }
    // ---- 雪地小鱼 ----
    const solids = c.rocks.concat(c.pillars);
    const addFish = (x,z,ph,gold)=>{
      x = clamp(x,-TRACK_HALF+1.6,TRACK_HALF-1.6);
      if(z<zBot+1.5 || z>zTop-1.5) return;
      for(const o of solids){ const dx=o.x-x, dz=o.z-z, rr=o.r+2.1; if(dx*dx+dz*dz<rr*rr) return; }
      for(const r of c.ramps) if(Math.abs(x-r.x)<3.2 && z<r.z+3 && z>r.z-r.len-44) return;
      c.fish.push({x,z,ph,lift:0,gold:!!gold,dead:false,sub:false});
    };
    for(let pi=0,n=zen?2+((rnd()*2)|0):1+((rnd()*2)|0); pi<n; pi++){
      const kind=(rnd()*4)|0, base=LANES[(rnd()*LANES.length)|0], z0=gz(0.06+rnd()*0.45);
      if(kind===0){ for(let i=0;i<9;i++) addFish(base, z0-i*5.2, i*0.5); }
      else if(kind===1){ const amp=2.3+rnd()*3.2, fr=0.3+rnd()*0.27; for(let i=0;i<12;i++) addFish(base+Math.sin(i*fr)*amp, z0-i*4.4, i*0.4); }
      else if(kind===2){ for(let i=0;i<9;i++) addFish(base+(i%2?3.4:-3.4), z0-i*5.0, i*0.6); }
      else { for(let i=0;i<3;i++) for(let j=0;j<3;j++) addFish(base-1.9+i*1.9, z0-j*3.6, (i+j)*0.7); }
    }
    if(k<=-1 && rnd()<0.3) addFish(side()*8.9, gz(0.1+rnd()*0.8), rnd()*TAU, true);
  }else{
    // ---- 冰海水道：气泡加速环、水面浮冰、水下冰礁、水上跃鱼与水下鱼群 ----
    const uA = role==='entry' ? 0.36 : 0.08;
    const uB = role==='exit'  ? 0.56 : 0.92;
    const uD = role==='entry' ? 0.48 : 0.08;
    const uD2= role==='exit'  ? 0.48 : 0.92;

    // 气泡加速环（水面半露或水下穿行）
    for(let i=0,n=role==='mid'?2:1; i<n; i++){
      const x=LANES[1+((rnd()*4)|0)], u=lerp(uA,uB,(i+0.4+rnd()*0.3)/n), z=gz(u);
      const deep = rnd()<0.5;
      c.wrings.push({x,z,yOff:deep?-1.7:0.45,deep,used:false,ph:rnd()*TAU});
    }
    // 冲刺模式水域障碍：浮冰（可跳可潜）+ 水下冰礁（浮面安全，潜泳需躲）
    if(!zen){
      const fn = role==='mid' ? 3 : 2;
      for(let i=0;i<fn;i++){
        const z=gz(lerp(uA,uB,(i+0.3+rnd()*0.4)/fn)), x=LANES[(rnd()*LANES.length)|0];
        if(c.wrings.some(w=>Math.abs(w.z-z)<8 && Math.abs(w.x-x)<3.5)) continue;
        c.floes.push({x,z,r:1.55,s:0.95+rnd()*0.3,ry:rnd()*TAU,ph:rnd()*TAU,dead:false,passed:false});
      }
      const rn = role==='mid' ? 3 : 1;
      for(let i=0;i<rn;i++){
        const z=gz(lerp(uD,uD2,(i+0.25+rnd()*0.5)/rn)), x=LANES[(rnd()*LANES.length)|0];
        if(c.wrings.some(w=>w.deep && Math.abs(w.z-z)<9 && Math.abs(w.x-x)<3.5)) continue;
        c.reefs.push({x,z,r:0.95,s:0.9+rnd()*0.4,ry:rnd()*TAU,dead:false,passed:false});
      }
    }
    // 水面跃鱼 + 水下金鱼通道
    const laneSurf = LANES[1+((rnd()*4)|0)], laneSub = LANES[(rnd()*LANES.length)|0];
    for(let i=0;i<7;i++){
      const z=gz(lerp(uA,uB,i/7));
      c.fish.push({x:laneSurf, z, ph:i*0.6, lift:0.6+Math.sin(i/6*Math.PI)*1.5, gold:false, dead:false, sub:false});
    }
    for(let i=0;i<6;i++){
      const z=gz(lerp(uD,uD2,(i+0.3)/6));
      c.fish.push({x:laneSub+Math.sin(i*0.7)*1.8, z, ph:i*0.5, lift:-1.65, gold:(i===5), dead:false, sub:true});
    }
  }

  chunks.set(k,c); chunksDirty = true;
}
function dropChunk(c){
  world.remove(c.ground); groundPool.push(c.ground);
  if(c.waterMesh){ world.remove(c.waterMesh); waterPool.push(c.waterMesh); }
  chunks.delete(c.k); chunksDirty = true;
}
function ensureChunks(){
  const kNow = chunkK(S.z);
  for(let k=kNow+BEHIND; k>=kNow-AHEAD; k--) if(!chunks.has(k)) makeChunk(k);
  for(const c of Array.from(chunks.values())) if(c.k>kNow+BEHIND || c.k<kNow-AHEAD) dropChunk(c);
}

const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
function put(im,n,x,y,z,rx,ry,sx,sy,sz){
  if(n>=im.userData.cap) return n;
  _p.set(x,y,z); _e.set(rx,ry,0); _q.setFromEuler(_e); _s.set(sx,sy,sz);
  _m.compose(_p,_q,_s); im.setMatrixAt(n,_m); return n+1;
}
function syncStatic(){
  let nr=0, nb=0, nm=0, nc=0, npi=0, ns=0, nrm=0, npd=0, nrf=0;
  fishList = []; pengList = []; floeList = []; wringList = []; sballList = [];
  for(const c of chunks.values()){
    for(const o of c.rocks)   if(!o.dead) nr = put(imRock,nr, o.x,o.y,o.z, 0,o.ry, o.sx,o.sy,o.sz);
    for(const o of c.bergs)   nb = put(imBerg,nb,   o.x,o.y,o.z, o.rx,o.ry, o.sx,o.sy,o.sz);
    for(const o of c.mounds)  nm = put(imMound,nm,  o.x,o.y,o.z, 0,o.ry,    o.sx,o.sy,o.sz);
    for(const o of c.pillars) if(!o.dead) nc = put(imCrystal,nc, o.x,surfaceY(o.x,o.z)-0.3,o.z, 0,o.ry, o.s*1.25,o.h,o.s*1.25);
    for(const o of c.spires)  nc = put(imCrystal,nc, o.x,surfaceY(o.x,o.z)-0.5,o.z, 0,o.ry, o.s*1.6,o.h,o.s*1.6);
    for(const o of c.pines)   npi = put(imPine,npi, o.x,o.y,o.z, 0,o.ry, o.s,o.h,o.s);
    for(const o of c.snowmen) ns = put(imSnowman,ns, o.x,o.y,o.z, 0,o.ry, o.s,o.s,o.s);
    for(const o of c.reefs)   if(!o.dead) nrf = put(imReef,nrf, o.x,surfaceY(o.x,o.z)-0.1,o.z, 0,o.ry, o.s,o.s*1.2,o.s);
    for(const r of c.ramps){
      const yB=surfaceY(r.x,r.z), yL=surfaceY(r.x,r.z-r.len);
      nrm = put(imRamp,nrm, r.x,yB-0.04,r.z, Math.atan2(yL-yB,r.len),0, r.w/2.2,r.h,1);
    }
    for(const o of c.pads){
      const yA=surfaceY(o.x,o.z+2.5), yB=surfaceY(o.x,o.z-2.5);
      npd = put(imPad,npd, o.x,(yA+yB)*0.5+0.09,o.z, Math.atan2(yB-yA,5),0, 1,1,1);
    }
    for(const f of c.fish) if(!f.dead) fishList.push(f);
    for(const o of c.pengs) pengList.push(o);
    for(const o of c.floes) if(!o.dead) floeList.push(o);
    for(const o of c.wrings) if(!o.used) wringList.push(o);
    for(const o of c.snowballs) if(!o.dead) sballList.push(o);
  }
  const all=[[imRock,nr],[imBerg,nb],[imMound,nm],[imCrystal,nc],[imPine,npi],[imSnowman,ns],[imRamp,nrm],[imPad,npd],[imReef,nrf]];
  for(const [im,n] of all){ im.count=n; im.instanceMatrix.needsUpdate=true; }
}
function syncLive(dt,t){                    // 每帧都在动的实例：小鱼、企鹅、浮冰、气泡环、雪球
  let n=0, ng=0;
  for(const f of fishList){
    if(f.dead) continue;
    const w = f.sub ? null : waterAt(f.x,f.z);
    const baseY = f.sub ? (GRADE*f.z+WATER_OFF) : ((w.inPool?w.waterY:surfaceY(f.x,f.z))+1.0);
    const y = baseY+f.lift+Math.sin(t*2.2+f.ph)*0.22, sc=f.gold?1.5:1;
    f.wy = y;
    _e.set(0, t*(f.gold?2.8:1.5)+f.ph, Math.sin(t*1.8+f.ph)*0.22); _q.setFromEuler(_e); _s.set(sc,sc,sc);
    _p.set(f.x,y,f.z); _m.compose(_p,_q,_s);
    if(f.gold){ if(ng<GOLD_CAP) imGold.setMatrixAt(ng++,_m); }
    else if(n<FISH_CAP) imFish.setMatrixAt(n++,_m);
  }
  imFish.count=n; imGold.count=ng;
  imFish.instanceMatrix.needsUpdate=true; imGold.instanceMatrix.needsUpdate=true;

  let np=0;
  for(const o of pengList){              // 海豹靠近时蹦起来欢呼
    if(np>=PENG_CAP) break;
    const near=clamp(1-Math.abs(o.z-S.z+8)/28,0,1), w=Math.sin(t*9+o.ph), hop=Math.abs(w)*0.5*near;
    _e.set(0,o.ry,w*0.2*near); _q.setFromEuler(_e); _s.set(o.s,o.s*(1+hop*0.3),o.s);
    _p.set(o.x,o.y+hop,o.z); _m.compose(_p,_q,_s); imPeng.setMatrixAt(np++,_m);
  }
  imPeng.count=np; imPeng.instanceMatrix.needsUpdate=true;

  let nf=0;
  for(const o of floeList){
    if(o.dead || nf>=FLOE_CAP) continue;
    const wy = GRADE*o.z + WATER_OFF + Math.sin(t*3.2+o.ph)*0.09;
    o.wy = wy;
    _e.set(Math.sin(t*2.1+o.ph)*0.07, o.ry+t*0.15, Math.cos(t*2.4+o.ph)*0.07);
    _q.setFromEuler(_e); _s.set(o.s,o.s,o.s); _p.set(o.x,wy,o.z); _m.compose(_p,_q,_s);
    imFloe.setMatrixAt(nf++,_m);
  }
  imFloe.count=nf; imFloe.instanceMatrix.needsUpdate=true;

  let nwr=0;
  for(const o of wringList){
    if(o.used || nwr>=WRING_CAP) continue;
    const wy = GRADE*o.z + WATER_OFF + o.yOff + Math.sin(t*3+o.ph)*0.12;
    o.wy = wy;
    _e.set(0, 0, t*1.8+o.ph); _q.setFromEuler(_e); _s.set(1,1,1);
    _p.set(o.x,wy,o.z); _m.compose(_p,_q,_s);
    imWRing.setMatrixAt(nwr++,_m);
  }
  imWRing.count=nwr; imWRing.instanceMatrix.needsUpdate=true;

  let nsb=0;
  for(const o of sballList){
    if(o.dead || nsb>=SBALL_CAP) continue;
    if(S.state==='play' && o.z < S.z+12 && o.z > S.z-160){
      const nextZ = o.z + o.vz*dt*0.35; // 迎面滚来略微减速给玩家躲避反应，或顺坡滚下：顺坡向下滚 (-vz)
      void nextZ;
      o.z -= o.vz*dt;
      o.x += o.vx*dt;
      if(Math.abs(o.x) > TRACK_HALF-1.4){ o.x = clamp(o.x,-TRACK_HALF+1.4,TRACK_HALF-1.4); o.vx = -o.vx; }
      const wr = waterRole(chunkK(o.z));
      if(wr!=='snow'){ o.dead=true; chunksDirty=true; continue; }
      o.rot -= o.vz*dt;
    }
    const gy = surfaceY(o.x,o.z) + o.r*0.92;
    o.wy = gy;
    _e.set(o.rot, 0, -o.x*0.2); _q.setFromEuler(_e); _s.set(o.r,o.r,o.r);
    _p.set(o.x,gy,o.z); _m.compose(_p,_q,_s);
    imSnowball.setMatrixAt(nsb++,_m);
  }
  imSnowball.count=nsb; imSnowball.instanceMatrix.needsUpdate=true;
}

function curV(){
  return S.speed*S.speedMod*(S.ball?1.06:1)*(S.boost>0?1.32:1)*(S.fever>0?1.12:1);
}
function tryDive(){
  if(S.state!=='play') return;
  if(S.air && !S.slam && !S.rebound && S.airT>0.08){
    S.superSlam = S.flip && (S.airT/Math.max(0.2,S.airDur) > 0.45);
    S.slam=true; S.flip=false; S.vy = Math.min(S.vy,-4)-18;
    seal.flip.rotation.x = wrapPi(seal.flip.rotation.x);
    kick(3); Snd.dive();
  }else if(S.inWater && !S.air && !S.diving){
    S.diving=true; S.diveT=DIVE_DUR; kick(-4); Snd.dive();
    emitBubbles(S.x, S.y, S.z, 12);
  }
}
function tryJump(){
  if(S.state!=='play') return;
  const vEff = curV();
  if(!S.air){
    if(S.inWater){
      const w = waterAt(S.x, S.z);
      if(S.diving){                                             // 潜泳中起跳：破水空翻
        S.diving=false; S.diveT=0; S.air=true; S.airT=0; S.flip=true; S.slam=false; S.superSlam=false; S.rebound=false;
        const vyRel = 14.8;
        S.vy = vyRel - vEff*GRADE; S.airDur = 2*vyRel/GRAV;
        kick(6); J.happyT=0.8; J.mouthT=0.3; Snd.splash(true); Snd.jump();
        emitWaterSplash(S.x, w.waterY, S.z, 28, 1.45); ring(S.x, w.waterY, S.z, 4.2, 0xA9DDF2, 0.45, 0.65);
        popup('破水空翻', 'water');
      }else{                                                    // 水面跃起：海豚跳
        S.air=true; S.airT=0; S.flip=false; S.slam=false; S.superSlam=false; S.rebound=false;
        const vyRel = 12.6;
        S.vy = vyRel - vEff*GRADE; S.airDur = 2*vyRel/GRAV;
        kick(5); J.mouthT=0.3; Snd.jump(); Snd.splash(false);
        emitWaterSplash(S.x, w.waterY, S.z, 16, 1.0); ring(S.x, w.waterY, S.z, 2.8, 0xDDF6FF, 0.38, 0.45, true);
      }
    }else{                                                      // 雪地起跳（按坡度补偿）
      S.air=true; S.airT=0; S.flip=false; S.slam=false; S.superSlam=false; S.rebound=false;
      const vyRel = 13.8;
      S.vy = vyRel - vEff*GRADE; S.airDur = 2*vyRel/GRAV;
      kick(5); J.mouthT=0.3; Snd.jump();
      emitSpray(S.x, S.y+0.1, S.z, 16, 1.2);
    }
  }else if(!S.slam && !S.rebound && S.airT>0.1){                // 空中再按一次：肚皮砸地 / 鱼雷入水
    tryDive();
  }
}
