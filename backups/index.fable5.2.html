<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海豹冲冲冲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/*
  Layout: the 3D slope is the page. The HUD is four small corner read-outs over it,
  and every menu is a scrim on a live frame of the world; the title screen keeps one
  side clear so the seal's face is the hero.
  One committed visual world (polar ice + a single warm accent, the seal's hat and scarf),
  so there are deliberately no prefers-color-scheme / data-theme blocks.
*/
:root{
  --ice:#F2F8FC;
  --ice-dim:#B4CADC;
  --deep:#08131F;
  --accent:#FF7A45;
  --gold:#FFC94A;
  --mint:#5FE0BE;
  --danger:#FF6B6B;
  --glass:rgba(8,19,31,.56);
  --panel:rgba(10,24,38,.66);
  --line:rgba(180,202,220,.24);
  --font-display:'ZCOOL KuaiLe','Fredoka','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-num:'Fredoka','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-ui:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --top:calc(14px + env(safe-area-inset-top,0px));
  --bot:calc(14px + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--deep);color:var(--ice);font-family:var(--font-ui);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash,#glow{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}
#flash{background:radial-gradient(ellipse at center,rgba(255,90,90,0) 42%,rgba(255,70,70,.6) 100%)}
#glow{background:radial-gradient(ellipse at center,rgba(255,201,74,0) 52%,rgba(255,186,70,.5) 100%)}
#popups{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:8;pointer-events:none;transition:opacity .5s ease}
#hud.off{opacity:0}
.hud-tl,.hud-tr,.hud-bl{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(9px)}
.hud-tl{position:absolute;top:var(--top);left:var(--gut-l);display:flex;flex-direction:column;gap:7px;padding:9px 14px 11px;border-radius:16px}
.hud-tr{position:absolute;top:var(--top);right:var(--gut-r);display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding:9px 14px 11px;border-radius:16px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat-k{font-size:11px;letter-spacing:.16em;color:var(--ice-dim);font-weight:600}
.stat-v{display:flex;align-items:baseline;gap:4px;font-family:var(--font-num);font-weight:600;line-height:1.05}
.stat-v b{font-size:30px;font-variant-numeric:tabular-nums}
.stat-v i{font-size:13px;font-style:normal;color:var(--ice-dim)}
.stat.score .stat-v b{font-size:22px;color:var(--gold)}
.stat.right{align-items:flex-end}
.stat.right .stat-v b{font-size:19px}
.fev{display:flex;align-items:center;gap:8px;margin-top:2px}
.fev-bar{width:78px;height:6px;border-radius:3px;background:rgba(180,202,220,.2);overflow:hidden}
.fev-bar i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--accent))}
.fev.on .stat-k{color:var(--gold)}
.fev.on .fev-bar i{background:linear-gradient(90deg,#FFF3C2,var(--gold))}
.hearts{display:flex;gap:5px}
.heart{width:17px;height:16px;background:var(--accent);
  clip-path:path('M8.5 15.2 C-3 7.6 1.2 -.4 5.6 1 C7.4 1.6 8.5 3.6 8.5 3.6 C8.5 3.6 9.6 1.6 11.4 1 C15.8 -.4 20 7.6 8.5 15.2Z');
  transition:transform .2s ease,opacity .25s ease}
.heart.gone{opacity:.22;transform:scale(.8)}

#combo{
  position:absolute;left:50%;top:var(--top);
  display:flex;align-items:center;gap:9px;padding:6px 14px 6px 13px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(9px);
  font-family:var(--font-num);font-weight:700;font-size:18px;
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,1.6,.4,1);
  opacity:0;transform:translate(-50%,-8px) scale(.72);
}
#combo.on{opacity:1;transform:translate(-50%,0) scale(1)}
#combo b{color:var(--mint);font-variant-numeric:tabular-nums}
.combo-bar{width:64px;height:4px;border-radius:2px;background:rgba(180,202,220,.22);overflow:hidden}
.combo-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transform-origin:left}
#ballhud{
  position:absolute;left:50%;top:calc(var(--top) + 46px);transform:translateX(-50%);
  display:none;align-items:center;gap:9px;padding:5px 13px;border-radius:999px;white-space:nowrap;
  background:var(--glass);border:1px solid rgba(255,201,74,.45);backdrop-filter:blur(9px);
  font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:600;
}
#ballhud.on{display:flex}
.wob{width:58px;height:5px;border-radius:3px;background:rgba(255,201,74,.2);overflow:hidden}
.wob i{display:block;height:100%;width:0%;background:var(--gold);border-radius:3px}
.wob.warn i{background:var(--danger)}
#toast{
  position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--font-display);font-size:clamp(26px,6.4vw,42px);letter-spacing:.08em;
  text-shadow:0 2px 0 rgba(8,19,31,.6),0 0 14px rgba(8,19,31,.7),0 4px 30px rgba(4,10,18,.8);opacity:0;
  transition:opacity .5s ease,letter-spacing 1.8s cubic-bezier(.2,.7,.2,1);
}
#toast.on{opacity:1;letter-spacing:.2em}
#toast.hot{color:var(--gold)}
.hud-bl{
  position:absolute;left:var(--gut-l);bottom:var(--bot);display:flex;align-items:center;gap:9px;
  font-size:12px;color:var(--ice-dim);letter-spacing:.06em;white-space:nowrap;
  padding:6px 14px;border-radius:999px;
}
.hud-bl b{font-family:var(--font-num);font-size:15px;color:var(--ice);font-variant-numeric:tabular-nums}
.hud-bl .biome{color:var(--ice);font-weight:600}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ice-dim);opacity:.6}
#hint{
  position:absolute;left:50%;bottom:calc(var(--bot) + 44px);transform:translateX(-50%);
  max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11.5px;color:var(--ice);letter-spacing:.05em;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  backdrop-filter:blur(9px);transition:opacity .8s ease;
}
#hint.fade{opacity:0}
#jumpbtn{
  position:fixed;z-index:9;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));
  width:78px;height:78px;border-radius:50%;border:1px solid rgba(180,202,220,.36);
  background:rgba(8,19,31,.6);color:var(--ice);font-size:13px;font-weight:600;letter-spacing:.08em;
  backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;touch-action:none;
}
#jumpbtn.press{transform:scale(.92);background:rgba(255,122,69,.4)}
#pausebtn{
  position:fixed;z-index:9;right:var(--gut-r);bottom:var(--bot);
  padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  color:var(--ice-dim);font-size:11.5px;letter-spacing:.1em;backdrop-filter:blur(9px);display:none;
}
#jumpbtn.show{display:flex}
#pausebtn.show{display:block}

/* ---------- 飘字 ---------- */
.pop{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--font-num);font-weight:700;font-size:19px;color:var(--gold);
  text-shadow:0 2px 12px rgba(4,10,18,.85);white-space:nowrap;
  animation:pop .8s cubic-bezier(.15,.9,.3,1) forwards;
}
.pop.good{color:var(--mint);font-size:22px}
.pop.bad{color:var(--danger)}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-95%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-210%) scale(.92)}
}

/* ---------- 菜单 ---------- */
#screens{position:fixed;inset:0;z-index:20;display:none}
#screens.on{display:block}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l);
  background:radial-gradient(120% 90% at 50% 34%,rgba(8,19,31,.42) 0%,rgba(8,19,31,.78) 62%,rgba(8,19,31,.93) 100%);
  backdrop-filter:blur(6px);
}
.screen.on{display:flex}
.wrap{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}

#scr-start{
  backdrop-filter:none;padding-left:max(6vw,16px);
  background:linear-gradient(90deg,rgba(8,19,31,.92) 0%,rgba(8,19,31,.7) 30%,rgba(8,19,31,0) 64%);
}
#scr-start .wrap{margin:auto 0;align-items:flex-start;text-align:left}
@media (max-aspect-ratio:115/100){
  #scr-start{
    padding-left:var(--gut-l);
    background:linear-gradient(180deg,rgba(8,19,31,0) 30%,rgba(8,19,31,.78) 50%,rgba(8,19,31,.96) 100%);
  }
  #scr-start .wrap{margin:auto auto 0;align-items:center;text-align:center}
}

.eyebrow{font-size:11px;letter-spacing:.34em;color:var(--ice-dim);font-weight:600;margin:0}
h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(46px,13vw,72px);line-height:1;
  margin:0;letter-spacing:.02em;text-wrap:balance;
  background:linear-gradient(176deg,#FFFFFF 24%,#A9DDF2 68%,#5FE0BE 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(95,224,190,.2));
}
h2{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{margin:0;font-size:14.5px;line-height:1.75;color:var(--ice-dim);max-width:32ch;text-wrap:pretty}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode{
  display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;
  padding:13px 14px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);color:var(--ice);cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,background .16s ease;
}
.mode:hover{border-color:rgba(95,224,190,.55);transform:translateY(-2px)}
.mode[aria-pressed="true"]{border-color:var(--mint);background:rgba(14,48,60,.82)}
.mode b{font-family:var(--font-display);font-size:21px;font-weight:400;letter-spacing:.06em}
.mode span{font-size:11.5px;color:var(--ice-dim);line-height:1.5}
.go{
  width:100%;padding:14px;border-radius:16px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#FF9A5E,var(--accent));color:#2A1004;
  font-family:var(--font-display);font-size:23px;letter-spacing:.14em;
  box-shadow:0 12px 30px rgba(255,122,69,.3);transition:transform .14s ease,filter .14s ease;
}
.go:hover{transform:translateY(-2px);filter:brightness(1.06)}
.go:active{transform:translateY(0)}
.controls{margin:0;font-size:11.5px;color:var(--ice-dim);line-height:1.75;letter-spacing:.02em}
.best{margin:0;font-size:12px;color:var(--ice-dim);letter-spacing:.06em}
.best b{font-family:var(--font-num);font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.btns button{
  padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  color:var(--ice);font-family:var(--font-display);font-size:19px;letter-spacing:.08em;cursor:pointer;
  transition:transform .14s ease,border-color .14s ease;
}
.btns button:hover{border-color:rgba(180,202,220,.55);transform:translateY(-2px)}
.btns .primary{background:linear-gradient(180deg,#FF9A5E,var(--accent));color:#2A1004;border-color:transparent;box-shadow:0 12px 30px rgba(255,122,69,.28)}
.btns .wide{grid-column:1/-1;font-family:var(--font-ui);font-size:12.5px;letter-spacing:.1em;color:var(--ice-dim);padding:10px}
.rows{width:100%;display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;background:rgba(10,24,38,.78)}
.row span{font-size:12.5px;color:var(--ice-dim);letter-spacing:.06em}
.row b{font-family:var(--font-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.row b.hot{color:var(--gold)}
.rec{margin:0;font-size:12.5px;letter-spacing:.12em;color:var(--mint);font-weight:600;min-height:1.3em}
.keyhint{margin:0;font-size:11.5px;color:var(--ice-dim);letter-spacing:.06em}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

#boot{
  position:fixed;inset:0;z-index:30;background:var(--deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .6s ease;
}
#boot .nm{font-family:var(--font-display);font-size:32px;letter-spacing:.08em;color:var(--ice)}
#boot .ln{width:150px;height:3px;border-radius:2px;background:rgba(180,202,220,.16);overflow:hidden}
#boot .ln i{display:block;width:36%;height:100%;background:var(--mint);border-radius:2px;animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
#boot.done{opacity:0;pointer-events:none}
#boot .err{display:none;font-size:13px;color:var(--ice-dim);line-height:1.7;max-width:32ch;text-align:center;padding:0 16px}
#boot.failed .ln{display:none}
#boot.failed .err{display:block}
@media (max-height:540px){.lede,.controls{display:none}.wrap{gap:11px}h1{font-size:44px}}
@media (max-width:420px){.stat-v b{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.05s!important}}
</style>

<canvas id="gl"></canvas>
<div id="glow" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="popups" aria-hidden="true"></div>

<div id="hud" class="off" aria-hidden="true">
  <div class="hud-tl">
    <div class="stat"><span class="stat-k">距离</span><span class="stat-v"><b id="ui-dist">0</b><i>m</i></span></div>
    <div class="stat score"><span class="stat-k">得分</span><span class="stat-v"><b id="ui-score">0</b></span></div>
    <div class="fev" id="ui-fev"><span class="stat-k">狂热</span><span class="fev-bar"><i></i></span></div>
  </div>
  <div class="hud-tr">
    <div class="stat right"><span class="stat-k">最高</span><span class="stat-v"><b id="ui-best">0</b></span></div>
    <div class="hearts" id="ui-hearts"></div>
  </div>
  <div id="combo"><b>×2</b><span class="combo-bar"><i></i></span></div>
  <div id="ballhud">金球平衡 <span class="wob" id="ui-wob"><i></i></span></div>
  <div id="toast"></div>
  <div class="hud-bl"><span class="biome" id="ui-biome">极地晴日</span><span class="dot"></span><span><b id="ui-spd">0</b> km/h</span></div>
  <div id="hint">A / D 转向 · 空格 跳 · 空中再按一次 肚皮砸地</div>
</div>

<button id="jumpbtn" aria-label="跳跃">跳</button>
<button id="pausebtn" aria-label="暂停">暂停</button>

<div id="screens">
  <div class="screen on" id="scr-start">
    <div class="wrap">
      <p class="eyebrow">3D 无尽雪坡滑行</p>
      <h1>海豹冲冲冲</h1>
      <p class="lede">肚皮贴着雪坡往下冲。吃小鱼攒满狂热槽，就能把冰晶撞个粉碎；跳到空中再按一次，肚皮砸地。</p>
      <div class="modes">
        <button class="mode" id="mode-rush" data-mode="rush" aria-pressed="true"><b>冲刺</b><span>冰晶和岩石挡路，3 颗心</span></button>
        <button class="mode" id="mode-zen" data-mode="zen" aria-pressed="false"><b>禅意</b><span>没有障碍，只有雪、小鱼和极光</span></button>
      </div>
      <button class="go" id="btn-go">开始下滑</button>
      <p class="controls" id="ctl-text">A / D 或 ← → 转向，空格跳跃，空中再按一次砸地<br>贴着障碍擦过去有奖励，M 键静音</p>
      <p class="best">最高分 <b id="ui-best2">0</b></p>
    </div>
  </div>

  <div class="screen" id="scr-over">
    <div class="wrap">
      <p class="eyebrow" id="o-eyebrow">这一趟</p>
      <h2 id="o-title">海豹晕乎乎</h2>
      <div class="rows">
        <div class="row"><span>得分</span><b id="o-score">0</b></div>
        <div class="row"><span>距离</span><b id="o-dist">0 m</b></div>
        <div class="row"><span>小鱼</span><b id="o-fish">0</b></div>
        <div class="row"><span>最高连击</span><b id="o-combo">×1</b></div>
        <div class="row"><span>砸碎</span><b id="o-smash">0</b></div>
      </div>
      <p class="rec" id="o-rec"></p>
      <div class="btns">
        <button class="primary" id="btn-again">再来一次</button>
        <button id="btn-menu">换个模式</button>
      </div>
      <p class="keyhint" id="o-key">按空格立刻再来</p>
    </div>
  </div>

  <div class="screen" id="scr-pause">
    <div class="wrap">
      <p class="eyebrow">暂停</p>
      <h2>雪还在下</h2>
      <div class="btns">
        <button class="primary" id="btn-resume">继续滑</button>
        <button id="btn-quit">结束这趟</button>
        <button class="wide" id="btn-mute">声音：开</button>
      </div>
    </div>
  </div>
</div>

<div id="boot"><div class="nm">海豹冲冲冲</div><div class="ln"><i></i></div><div class="err"></div></div>

<script>
// 3D 引擎从 CDN 加载；如果迟迟没起来，给一句人话而不是一直转圈
setTimeout(function(){
  if(window.__sealReady) return;
  var b=document.getElementById('boot'); b.classList.add('failed');
  b.querySelector('.err').textContent='3D 引擎没有加载成功。检查一下网络，再刷新页面。';
}, 12000);
</script>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.169.0/three.module.min.js';

/* ============================================================
   0. 小工具
   ============================================================ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);
const damp  = (a,b,l,dt)=> lerp(a,b,1-Math.exp(-l*dt));
const wrap  = (v,c,h)=> c + ((((v-c+h)%(2*h))+2*h)%(2*h)) - h;
const TAU = Math.PI*2;
const wrapPi = a=> Math.atan2(Math.sin(a),Math.cos(a));
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const $ = id=> document.getElementById(id);
const V3 = (x,y,z)=> new THREE.Vector3(x,y,z);

const REDUCED = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const isTouch = window.matchMedia('(hover:none)').matches || navigator.maxTouchPoints>0 && window.matchMedia('(pointer:coarse)').matches;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ============================================================
   1. 地形数学
   高度是纯函数 surfaceY(x,z)。区块几何体只有 3 种，循环复用，永不重建。
   ============================================================ */
const CHUNK_LEN = 70, VARIANTS = 3, PHASES = [0, 2.17, 4.41];
const TRACK_HALF = 11, GRADE = 0.105, BANK_H = 9, GRAV = 34;
const LANES = [-8.6,-5.2,-1.75,1.75,5.2,8.6];

const chunkK    = z => Math.ceil(z/CHUNK_LEN);
const variantOf = k => ((k%VARIANTS)+VARIANTS)%VARIANTS;
// 基础项沿 z 的周期等于区块长度；带相位的变化项乘上在区块两端归零的窗函数，
// 所以相邻区块（哪怕变体不同）在接缝处的高度和坡度都严格一致。
const pnoise = (x,lz,ph)=>{
  const w = TAU/CHUNK_LEN, win = Math.sin(Math.PI*lz/CHUNK_LEN);
  return 0.34*Math.sin(x*0.16 + w*2*lz)
       + 0.20*Math.sin(w*3*lz - x*0.10 + 1.3)
       + win*win*(0.30*Math.sin(x*0.21 + w*2*lz + ph) + 0.16*Math.sin(x*0.52 + w*5*lz + ph*2.3));
};
function bankAt(x){
  const a = Math.abs(x);
  return a<=TRACK_HALF ? 0 : smooth(clamp((a-TRACK_HALF)/24,0,1))*BANK_H;
}
function surfaceY(x,z){
  const k = chunkK(z);
  return GRADE*z + bankAt(x) + pnoise(x, z-k*CHUNK_LEN, PHASES[variantOf(k)]);
}
const slopeAt = (x,z)=> Math.atan((surfaceY(x,z-1)-surfaceY(x,z+1))*0.5);

  const [c,g]=cv(size,size), h=size/2, gr=g.createRadialGradient(h,h,0,h,h,h);
  for(const s of stops) gr.addColorStop(s[0],'rgba(255,255,255,'+s[1]+')');

   ============================================================ */
function TRS(px,py,pz, sx=1,sy=1,sz=1, rx=0,ry=0,rz=0){
  return new THREE.Matrix4().compose(V3(px,py,pz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)), V3(sx,sy,sz));
}
// 把若干 [几何体, 颜色, 矩阵] 合成一个带顶点色的几何体，一个小模型只占一次绘制
function merge(parts){
  const P=[],N=[],C=[], c=new THREE.Color();
  for(const [geo,col,mat] of parts){
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if(mat) g.applyMatrix4(mat);
    c.set(col);
    const p=g.attributes.position.array, n=g.attributes.normal.array;
    for(let i=0;i<p.length;i+=3){ P.push(p[i],p[i+1],p[i+2]); N.push(n[i],n[i+1],n[i+2]); C.push(c.r,c.g,c.b); }
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(N,3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(C,3));
  return out;
}
const ball = (rx,ry,rz,ws=16,hs=12)=>{ const g=new THREE.SphereGeometry(1,ws,hs); g.scale(rx,ry,rz); return g; };

function makeChunkGeometry(variant){
  const ph = PHASES[variant];
  const XS=[];
  { const left=[]; let step=2.2, x=-TRACK_HALF;
    while(x>-160){ x-=step; step*=1.24; left.push(x); }
    left.reverse(); for(const v of left) XS.push(v);
    for(let v=-TRACK_HALF; v<=TRACK_HALF+1e-6; v+=1.375) XS.push(v);
    step=2.2; x=TRACK_HALF;
    while(x<160){ x+=step; step*=1.24; XS.push(x); } }
  const W=XS.length, ZN=30, dz=CHUNK_LEN/(ZN-1);
  const hAt=(xx,lz)=> GRADE*lz + bankAt(xx) + pnoise(xx,lz,ph);
  const cLow=new THREE.Color('#7F97B6'), cHigh=new THREE.Color('#FFFFFF'), cBank=new THREE.Color('#9DB2C8'), tmp=new THREE.Color();
  const pos=new Float32Array(W*ZN*3), col=new Float32Array(W*ZN*3), nrm=new Float32Array(W*ZN*3);
  let p=0;
  for(let j=0;j<ZN;j++){
    const lz=-j*dz;
    for(let i=0;i<W;i++){
      const xx=XS[i];
      pos[p]=xx; pos[p+1]=hAt(xx,lz); pos[p+2]=lz;
      tmp.copy(cLow).lerp(cHigh, clamp(0.55+pnoise(xx,lz,ph)*0.9,0,1));
      tmp.lerp(cBank, clamp(bankAt(xx)/BANK_H,0,1)*0.3);
      col[p]=tmp.r; col[p+1]=tmp.g; col[p+2]=tmp.b;
      // 解析法线：直接对高度函数求差分，接缝两侧的光照因此连续
      const e=0.25, nx=-(hAt(xx+e,lz)-hAt(xx-e,lz))/(2*e), nz=-(hAt(xx,lz+e)-hAt(xx,lz-e))/(2*e), il=1/Math.hypot(nx,1,nz);
      nrm[p]=nx*il; nrm[p+1]=il; nrm[p+2]=nz*il;
      p+=3;
    }
  }
  const idx=[];
  for(let j=0;j<ZN-1;j++) for(let i=0;i<W-1;i++){
    const a=j*W+i, b=a+1, c=a+W, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setIndex(idx);
  return g;
}

const OL = 0.04, PIV = 0.75;
const MAT_OUT = new THREE.MeshBasicMaterial({color:0x34495F, side:THREE.BackSide});
function shell(geo, mat, t){                   // 实体 + 沿法线外扩的背面描边
  const m = new THREE.Mesh(geo, mat); m.castShadow = true;
  if(t){
    const g=geo.clone(), p=g.attributes.position, n=g.attributes.normal;
    for(let i=0;i<p.count;i++) p.setXYZ(i, p.getX(i)+n.getX(i)*t, p.getY(i)+n.getY(i)*t, p.getZ(i)+n.getZ(i)*t);
    m.add(new THREE.Mesh(g, MAT_OUT));
  }
  return m;
}
function weld(g){                              // 变形后重算法线，并抹平球面接缝
  g.computeVertexNormals();
  const p=g.attributes.position, n=g.attributes.normal, map=new Map();
  for(let i=0;i<p.count;i++){
    const k=Math.round(p.getX(i)*1e3)+','+Math.round(p.getY(i)*1e3)+','+Math.round(p.getZ(i)*1e3);
    let a=map.get(k); if(!a){ a=[0,0,0,[]]; map.set(k,a); }
    a[0]+=n.getX(i); a[1]+=n.getY(i); a[2]+=n.getZ(i); a[3].push(i);
  }
  for(const a of map.values()){ const l=Math.hypot(a[0],a[1],a[2])||1; for(const i of a[3]) n.setXYZ(i,a[0]/l,a[1]/l,a[2]/l); }
  return g;
}
function sealBodyGeo(){
  const g=new THREE.SphereGeometry(1,40,28), p=g.attributes.position, col=new Float32Array(p.count*3);
  const back=new THREE.Color('#B4C4D8'), belly=new THREE.Color('#FBF8F2'), spot=new THREE.Color('#98ACC4'), c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const t=(z+1)/2, k=1-0.66*smooth(clamp((t-0.40)/0.60,0,1));         // 往尾巴收窄
    p.setXYZ(i, x*1.06*k, y*(y>0?0.90:0.62)*k+0.62+0.12*smooth(clamp((t-0.55)/0.45,0,1)), z*1.22+0.42);
    c.copy(belly).lerp(back, smooth(clamp((y+0.25)/0.7,0,1)));
    const s=Math.sin(x*7.3+z*5.1)*Math.sin(z*6.7-x*3.9+1.7);
    if(y>0.3) c.lerp(spot, smooth(clamp((s-0.45)/0.3,0,1))*0.6);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return weld(g);
}
const HA = [0.95,0.86,0.90];                   // 头的三个半轴
function sealHeadGeo(){
  const g=new THREE.SphereGeometry(1,36,26), p=g.attributes.position, col=new Float32Array(p.count*3);
  const back=new THREE.Color('#B4C4D8'), face=new THREE.Color('#FDFBF6'), c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const y=p.getY(i), z=p.getZ(i);
    c.copy(face).lerp(back, smooth(clamp((z+0.35+y*0.35)/0.6,0,1)));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.scale(HA[0],HA[1],HA[2]);
  return g;
}
const FWD = V3(0,0,-1);
function onHead(yaw,pitch,out=1){ const cp=Math.cos(pitch); return V3(HA[0]*Math.sin(yaw)*cp*out, HA[1]*Math.sin(pitch)*out, -HA[2]*Math.cos(yaw)*cp*out); }
function stick(obj,yaw,pitch,out){             // 把零件贴到头的表面，并让它的 -z 朝外
  const v=onHead(yaw,pitch,out);
  obj.position.copy(v);
  obj.quaternion.setFromUnitVectors(FWD, V3(v.x/(HA[0]*HA[0]), v.y/(HA[1]*HA[1]), v.z/(HA[2]*HA[2])).normalize());
  return obj;
}
function makeSeal(){
  const root=new THREE.Group(), tilt=new THREE.Group(), flip=new THREE.Group(), jelly=new THREE.Group();
  root.add(tilt); tilt.add(flip); flip.add(jelly); flip.position.y=PIV; jelly.position.y=-PIV;
  const std=(color,roughness)=> new THREE.MeshStandardMaterial({color,roughness});
  const skin=new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.75});
  const mFin=std('#9AAEC6',0.75), mEye=std('#17121C',0.1), mWhite=new THREE.MeshBasicMaterial({color:0xFFFFFF});
  const mMuzzle=std('#FFFFFF',0.8), mScarf=std('#FF7A45',0.85), mCream=std('#FFF3DF',0.9), mMouth=std('#93323F',0.6);
  const mPink=new THREE.MeshStandardMaterial({color:'#FF9AA6', roughness:1, transparent:true, opacity:0.8, depthWrite:false});

  jelly.add(shell(sealBodyGeo(), skin, OL));

  const flippers=[];
  for(const s of [-1,1]){
    const piv=new THREE.Group(); piv.position.set(s*0.85,0.34,0.0);
    const f=shell(ball(0.40,0.10,0.24,14,10), mFin, OL*0.8); f.position.set(s*0.30,-0.04,0.10);
    piv.add(f); jelly.add(piv); flippers.push({piv,s,a:0});
  }
  const tail=new THREE.Group(); tail.position.set(0,0.76,1.62); jelly.add(tail);
  for(const s of [-1,1]){
    const f=shell(ball(0.20,0.06,0.36,12,8), mFin, OL*0.8); f.position.set(s*0.17,0,0.24); f.rotation.y=s*0.45; tail.add(f);
  }

  // 围巾：斜着卡在脑袋和身体的交界上
  const scarf=shell(new THREE.TorusGeometry(0.80,0.17,12,30), mScarf, OL*0.8);
  scarf.position.set(0,0.80,-0.20); scarf.rotation.x=0.22; scarf.scale.set(1.10,0.92,1); jelly.add(scarf);
  const knot=shell(ball(0.16,0.15,0.15,10,8), mScarf, OL*0.8); knot.position.set(0.72,1.36,-0.10); jelly.add(knot);
  const tails=[];
  for(const s of [-1,1]){
    const piv=new THREE.Group(); piv.position.set(0.72,1.36,-0.10);
    const t=shell(ball(0.12,0.05,0.40,10,8), mScarf, OL*0.7); t.position.z=0.42;
    piv.add(t); jelly.add(piv); tails.push({piv,s});
  }

  // 脑袋
  const neck=new THREE.Group(); neck.position.set(0,0.75,-0.50); jelly.add(neck);
  const head=new THREE.Group(); head.position.set(0,0.30,-0.55); neck.add(head);
  head.add(shell(sealHeadGeo(), skin, OL));

  const eyes=[];
  for(const s of [-1,1]){
    const eye=stick(new THREE.Group(), s*0.43, 0.02, 0.97); head.add(eye);
    const open=new THREE.Mesh(ball(0.185,0.215,0.10,20,14), mEye);
    const g1=new THREE.Mesh(ball(0.066,0.066,0.03,10,8), mWhite); g1.position.set(-0.055,0.08,-0.085);
    const g2=new THREE.Mesh(ball(0.032,0.032,0.02,8,6), mWhite); g2.position.set(0.065,-0.075,-0.085);
    open.add(g1,g2);
    const happy=new THREE.Mesh(new THREE.TorusGeometry(0.135,0.036,8,18,Math.PI), mEye); happy.position.set(0,-0.04,-0.05);
    const ouch=new THREE.Group(); ouch.position.z=-0.06;
    for(const u of [-1,1]){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.055,0.05), mEye); b.position.y=u*0.06; b.rotation.z=u*s*0.5; ouch.add(b); }
    eye.add(open,happy,ouch); eyes.push({open,happy,ouch});
  }
  for(const s of [-1,1]){
    const puff=stick(shell(ball(0.21,0.165,0.13,16,12), mMuzzle, OL*0.5), s*0.135, -0.27, 0.99); head.add(puff);
    for(const d of [[0.09,0.04],[0.12,-0.03],[0.06,-0.07]]){
      const zz=-0.13*Math.sqrt(1-(d[0]/0.21)**2-(d[1]/0.165)**2)*1.03;
      const dot=new THREE.Mesh(ball(0.017,0.017,0.012,6,6), mEye); dot.position.set(s*d[0],d[1],zz); puff.add(dot);
    }
    head.add(stick(new THREE.Mesh(ball(0.15,0.10,0.03,12,8), mPink), s*0.80, -0.20, 0.99));
  }
  const nose=stick(new THREE.Mesh(ball(0.088,0.062,0.05,12,8), mEye), 0, -0.14, 1.06); head.add(nose);
  const mouth=stick(new THREE.Mesh(ball(0.075,0.09,0.05,10,8), mMouth), 0, -0.45, 0.99); head.add(mouth);

  // 毛线帽 + 绒球
  const hat=new THREE.Group(); hat.rotation.x=0.30; head.add(hat);
  const capG=new THREE.SphereGeometry(1,28,12,0,TAU,0,Math.PI*0.40); capG.scale(0.99,0.91,0.945);
  hat.add(shell(capG, mScarf, OL*0.8));
  const cuffG=new THREE.TorusGeometry(0.93,0.085,10,32); cuffG.rotateX(Math.PI/2); cuffG.scale(1,1,0.955);
  const cuff=shell(cuffG, mCream, OL*0.6); cuff.position.y=0.285; hat.add(cuff);
  const pom=new THREE.Group(); pom.position.set(0,0.90,0); hat.add(pom);
  const pomBall=shell(ball(0.2,0.2,0.2,14,10), mCream, OL*0.8); pomBall.position.y=0.16; pom.add(pomBall);

  // 顶金球的位置（鼻尖正前方）
  const noseAnchor=new THREE.Object3D(); noseAnchor.position.set(0,0.10,-1.955); neck.add(noseAnchor);

  // 晕乎乎的小星星
  const dizzy=new THREE.Group(); dizzy.position.set(0,2.35,-0.9); dizzy.visible=false; jelly.add(dizzy);
  const mStar=new THREE.SpriteMaterial({map:TEX_SPARK, color:0xFFD36E, transparent:true, depthWrite:false});
  for(let i=0;i<3;i++){ const sp=new THREE.Sprite(mStar); sp.scale.set(0.5,0.5,1); sp.position.set(Math.cos(i*TAU/3)*0.6,0,Math.sin(i*TAU/3)*0.6); dizzy.add(sp); }

  root.scale.setScalar(0.88);
  return {root,tilt,flip,jelly,neck,head,eyes,mouth,flippers,tail,tails,pom,noseAnchor,dizzy};
}

function animateSeal(dt,t){
  const play=S.state==='play', over=S.state==='over', air=S.air;
  // 身体：落地压扁、起跳拉长，贴地时跟着地面起伏一颠一颠
  if(!air){
    const gv=(S.y-J.pgy)/dt; J.sv -= clamp(gv-J.pgv,-6,6)*0.12; J.pgv=gv;
    if(!over) J.sv += Math.sin(t*8.5)*8*dt;
  }else J.pgv=0;
  J.pgy=S.y;
  J.sv += (((over?0.8:1)-J.s)*170 - J.sv*9)*dt;
  J.s = clamp(J.s+J.sv*dt, 0.5, 1.55);
  let sy=J.s;
  if(air) sy *= 1+clamp(S.vy*0.011,-0.1,0.16)+(S.slam?0.1:0);
  const sxz=1/Math.sqrt(sy);
  seal.jelly.scale.set(sxz,sy,sxz);

  // 脑袋：转弯时往那边看，标题页会看镜头，顶球时仰起来
  let tp=0, ty=0, tr=0;
  if(S.ball) tp=0.75; else if(over) tp=-0.22; else if(air) tp=clamp(S.vy*0.02,-0.3,0.35);
  if(play){ ty=-S.steer*0.55; tr=-S.steer*0.16; }
  else if(S.state==='attract'){
    const w=wrapPi(Math.atan2(-(camera.position.x-S.x), -(camera.position.z-S.z)) - seal.root.rotation.y);
    ty = Math.abs(w)<1.9 ? clamp(w,-0.95,0.95) : 0; tp=0.06; tr=Math.sin(t*0.9)*0.09;
  }
  J.hpv += ((tp-J.hp)*80 - J.hpv*8 + J.sv*3)*dt; J.hp += J.hpv*dt;
  J.hy = damp(J.hy,ty,7,dt); J.hr = damp(J.hr,tr,7,dt);
  seal.neck.rotation.set(J.hp,J.hy,J.hr);

  // 绒球
  const ax=clamp((S.vx-J.pvx)/dt,-80,80); J.pvx=S.vx;
  J.pzv += (-J.pz*150 - J.pzv*5 + ax*1.6)*dt; J.pz=clamp(J.pz+J.pzv*dt,-1,1);
  J.pxv += (-J.px*150 - J.pxv*5 - J.sv*16)*dt; J.px=clamp(J.px+J.pxv*dt,-1,1);
  seal.pom.rotation.set(J.px,0,J.pz);

  // 表情
  J.blink-=dt; if(J.blink<=0){ J.blink=1.8+Math.random()*3.2; J.blinkT=0.12; }
  if(J.blinkT>0) J.blinkT-=dt;
  if(J.happyT>0) J.happyT-=dt;
  if(J.mouthT>0) J.mouthT-=dt;
  if(S.hurtT>0 && !over) S.hurtT-=dt;
  const face = (over||S.hurtT>0) ? 2 : (J.happyT>0||S.fever>0||S.boost>0||(air&&S.flip)) ? 1 : 0;
  for(const e of seal.eyes){ e.open.visible=face===0; e.happy.visible=face===1; e.ouch.visible=face===2; e.open.scale.y = J.blinkT>0?0.12:1; }
  J.mouth = damp(J.mouth, (J.mouthT>0||air||face===2)?1:0, 18, dt);
  seal.mouth.visible = J.mouth>0.06; seal.mouth.scale.set(0.6+J.mouth*0.4, Math.max(0.06,J.mouth), 1);
  seal.dizzy.visible = face===2; seal.dizzy.rotation.y += dt*7;

  // 鳍、尾巴、围巾尾
  for(const f of seal.flippers){
    f.a = damp(f.a, air ? -0.95+Math.sin(t*22+f.s)*0.25 : over ? 0.15 : Math.sin(t*8.5+f.s*0.8)*0.24, 14, dt);
    f.piv.rotation.z = -f.s*(0.35+f.a);
    f.piv.rotation.y = -f.s*(0.5+(air?-0.3:Math.sin(t*8.5+1.2)*0.18));
  }
  seal.tail.rotation.y = Math.sin(t*(air?16:9))*(air?0.55:(over?0.1:0.38));
  seal.tail.rotation.x = -0.25+(air?-0.35:0)+Math.sin(t*4.5)*0.08;
  for(const f of seal.tails){
    f.piv.rotation.y = 0.3+f.s*0.2+Math.sin(t*11+f.s)*0.22;
    f.piv.rotation.x = -0.15+Math.sin(t*13+f.s*2)*0.25-(air?clamp(S.vy*0.03,-0.5,0.5):0);
  }

  // 贴地的软影子、狂热光晕
  const gy=surfaceY(S.x,S.z), k=1/(1+Math.max(0,S.y-gy)*0.3);
  blob.position.set(S.x, gy+0.05, S.z+0.2); blob.rotation.x=slopeAt(S.x,S.z);
  blob.scale.set(1.4*k,1,1.95*k); blob.material.opacity=0.36*k;
  aura.material.opacity = damp(aura.material.opacity, S.fever>0 ? 0.75 : 0, 6, dt);
  aura.visible = aura.material.opacity>0.01; aura.position.set(S.x,gy+0.07,S.z);
  aura.rotation.x = blob.rotation.x; aura.scale.setScalar(3.6+Math.sin(t*12)*0.3);
}

function makePoints(n,size,color,opacity,blending,map){
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++) arr[i*3+1] = -9999;                 // 先放到视野外
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({size, map:map||TEX_DOT, color, transparent:true, opacity,
    depthWrite:false, sizeAttenuation:true, blending:blending||THREE.NormalBlending, fog:false}));

    this.padGain = ac.createGain(); this.padGain.gain.value=0; plp.connect(this.padGain); this.padGain.connect(this.master);

  },

  ground.geometry = CHUNK_GEOS[variantOf(k)];

  for(let i=0,n=2+((rnd()*3)|0); i<n; i++){
    const x=side()*(46+rnd()*85), z=gz(rnd()), s=8+rnd()*16;
    c.bergs.push({x,z,y:surfaceY(x,z)-s*0.2, sx:s, sy:s*(0.7+rnd()*0.9), sz:s*(0.8+rnd()*0.5), ry:rnd()*TAU, rx:(rnd()-0.5)*0.5});
  }
  for(let i=0,n=4+((rnd()*5)|0); i<n; i++){
    const x=side()*(TRACK_HALF+3.5+rnd()*30), z=gz(rnd()), s=1.2+rnd()*3;
    c.mounds.push({x,z,y:surfaceY(x,z)-s*0.25, sx:s*1.6, sy:s*0.7, sz:s*1.6, ry:rnd()*TAU});
  }
  for(let i=0,n=1+((rnd()*3)|0); i<n; i++){
    const x=side()*(TRACK_HALF+5+rnd()*24), z=gz(rnd());
    c.spires.push({x,z,s:1.3+rnd()*2.2,h:5+rnd()*12,ry:rnd()*TAU});
  }
  for(let i=0,n=5+((rnd()*7)|0); i<n; i++){
    const x=side()*(TRACK_HALF+4.5+rnd()*34), z=gz(rnd()), s=0.9+rnd()*1.1;
    c.pines.push({x,z,y:surfaceY(x,z)-0.15,s,h:s*(0.9+rnd()*0.4),ry:rnd()*TAU});
  }
  if(rnd()<0.24){
    const sd=side(), x=sd*(TRACK_HALF+2+rnd()*2.5), z=gz(rnd());
    c.snowmen.push({x,z,y:surfaceY(x,z)-0.08,s:0.95+rnd()*0.35,ry:-sd*0.8+(rnd()-0.5)*0.4});
  }
  if(rnd()<0.5){
    const sd=side(), z0=gz(0.1+rnd()*0.8), n=1+((rnd()*4)|0);
    for(let i=0;i<n;i++){
      const x=sd*(TRACK_HALF+1.4+rnd()*1.3), z=z0-i*(1.1+rnd()*0.5);
      c.pengs.push({x,z,y:surfaceY(x,z)-0.02,s:0.95+rnd()*0.4,ry:-sd*0.9+(rnd()-0.5)*0.5,ph:rnd()*TAU});
    }
  }

  // ---- 跳台 + 腾空路线上的一串鱼 ----
  if(k<=-1 && rnd()<0.38){
    const x=LANES[1+((rnd()*4)|0)], z=gz(0.22+rnd()*0.30);
    c.ramps.push({x,z,w:2.3,len:5.2,h:1.75});
    for(let i=0;i<5;i++){ const u=(i+0.5)/5; c.fish.push({x, z:z-5.2-4-i*4.6, ph:i*0.5, lift:0.5+10.4*u*(1-u), gold:false, dead:false}); }
  }
  // ---- 加速带 ----
  if(rnd()<0.30){
    const x=LANES[(rnd()*LANES.length)|0], z=gz(0.15+rnd()*0.7);
    if(!blockedZone(c,x,z)) c.pads.push({x,z,used:false});
  }
  // ---- 障碍：开局 140 米不放，之后随距离变密；每排最多封 3 条道，永远留路 ----
  if(!zen && k<=-2){
    const groups = 1+Math.round(diff*2.4);
    for(let gi=0; gi<groups; gi++){
      const zRow = gz(0.08 + (gi+0.2+rnd()*0.6)/groups*0.86);
      const order=[0,1,2,3,4,5];
      for(let i=5;i>0;i--){ const j=(rnd()*(i+1))|0, t=order[i]; order[i]=order[j]; order[j]=t; }
      const n = 1 + (rnd()<0.25+diff*0.5?1:0) + (rnd()<diff*0.35?1:0);
      for(let bi=0; bi<n; bi++){
        const x=LANES[order[bi]]+(rnd()-0.5)*1.2, z=clamp(zRow+(rnd()-0.5)*7, zBot+3.5, zTop-3.5);
        if(blockedZone(c,x,z)){ rnd(); rnd(); rnd(); continue; }
        if(rnd()<0.5){
          const s=0.9+rnd()*0.5;
          c.pillars.push({x,z,s,h:2.6+rnd()*3.4,ry:rnd()*TAU,r:0.62*s,tall:true,dead:false,passed:false});
        }else{
          const s=0.95+rnd()*0.9;
          c.rocks.push({x,z,y:surfaceY(x,z)-0.35, sx:s*1.15, sy:s*0.95, sz:s*1.15, ry:rnd()*TAU, r:s*0.95, top:s*0.95-0.35, dead:false, passed:false});
        }
      }
    }
  }
  // ---- 小鱼：直线 / 波浪 / 之字 / 小簇，偶尔一条金鱼 ----
  const solids = c.rocks.concat(c.pillars);
  const addFish = (x,z,ph,gold)=>{
    x = clamp(x,-TRACK_HALF+1.6,TRACK_HALF-1.6);
    if(z<zBot+1.5 || z>zTop-1.5) return;
    for(const o of solids){ const dx=o.x-x, dz=o.z-z, rr=o.r+2.1; if(dx*dx+dz*dz<rr*rr) return; }
    for(const r of c.ramps) if(Math.abs(x-r.x)<3.2 && z<r.z+3 && z>r.z-r.len-28) return;
    c.fish.push({x,z,ph,lift:0,gold:!!gold,dead:false});
  };
  for(let pi=0,n=zen?2+((rnd()*2)|0):1+((rnd()*2)|0); pi<n; pi++){
    const kind=(rnd()*4)|0, base=LANES[(rnd()*LANES.length)|0], z0=gz(0.06+rnd()*0.45);
    if(kind===0){ for(let i=0;i<9;i++) addFish(base, z0-i*5.2, i*0.5); }
    else if(kind===1){ const amp=2.3+rnd()*3.2, fr=0.3+rnd()*0.27; for(let i=0;i<12;i++) addFish(base+Math.sin(i*fr)*amp, z0-i*4.4, i*0.4); }
    else if(kind===2){ for(let i=0;i<9;i++) addFish(base+(i%2?3.4:-3.4), z0-i*5.0, i*0.6); }
    else { for(let i=0;i<3;i++) for(let j=0;j<3;j++) addFish(base-1.9+i*1.9, z0-j*3.6, (i+j)*0.7); }
  }
  if(k<=-1 && rnd()<0.3) addFish(side()*8.9, gz(0.1+rnd()*0.8), rnd()*TAU, true);

  chunks.set(k,c); chunksDirty = true;
}
function dropChunk(c){ world.remove(c.ground); groundPool.push(c.ground); chunks.delete(c.k); chunksDirty = true; }
function ensureChunks(){
  const kNow = chunkK(S.z);
  for(let k=kNow+BEHIND; k>=kNow-AHEAD; k--) if(!chunks.has(k)) makeChunk(k);
  for(const c of Array.from(chunks.values())) if(c.k>kNow+BEHIND || c.k<kNow-AHEAD) dropChunk(c);
}

const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
function put(im,n,x,y,z,rx,ry,sx,sy,sz){
  if(n>=im.userData.cap) return n;
  _p.set(x,y,z); _e.set(rx,ry,0); _q.setFromEuler(_e); _s.set(sx,sy,sz);
  _m.compose(_p,_q,_s); im.setMatrixAt(n,_m); return n+1;
}
function syncStatic(){
  let nr=0, nb=0, nm=0, nc=0, npi=0, ns=0, nrm=0, npd=0;
  fishList = []; pengList = [];
  for(const c of chunks.values()){
    for(const o of c.rocks)   if(!o.dead) nr = put(imRock,nr, o.x,o.y,o.z, 0,o.ry, o.sx,o.sy,o.sz);
    for(const o of c.bergs)   nb = put(imBerg,nb,   o.x,o.y,o.z, o.rx,o.ry, o.sx,o.sy,o.sz);
    for(const o of c.mounds)  nm = put(imMound,nm,  o.x,o.y,o.z, 0,o.ry,    o.sx,o.sy,o.sz);
    for(const o of c.pillars) if(!o.dead) nc = put(imCrystal,nc, o.x,surfaceY(o.x,o.z)-0.3,o.z, 0,o.ry, o.s*1.25,o.h,o.s*1.25);
    for(const o of c.spires)  nc = put(imCrystal,nc, o.x,surfaceY(o.x,o.z)-0.5,o.z, 0,o.ry, o.s*1.6,o.h,o.s*1.6);
    for(const o of c.pines)   npi = put(imPine,npi, o.x,o.y,o.z, 0,o.ry, o.s,o.h,o.s);
    for(const o of c.snowmen) ns = put(imSnowman,ns, o.x,o.y,o.z, 0,o.ry, o.s,o.s,o.s);
    for(const r of c.ramps){
      const yB=surfaceY(r.x,r.z), yL=surfaceY(r.x,r.z-r.len);
      nrm = put(imRamp,nrm, r.x,yB-0.04,r.z, Math.atan2(yL-yB,r.len),0, r.w/2.2,r.h,1);
    }
    for(const o of c.pads){
      const yA=surfaceY(o.x,o.z+2.5), yB=surfaceY(o.x,o.z-2.5);
      npd = put(imPad,npd, o.x,(yA+yB)*0.5+0.09,o.z, Math.atan2(yB-yA,5),0, 1,1,1);
    }
    for(const f of c.fish) if(!f.dead) fishList.push(f);
    for(const o of c.pengs) pengList.push(o);
  }
  const all=[[imRock,nr],[imBerg,nb],[imMound,nm],[imCrystal,nc],[imPine,npi],[imSnowman,ns],[imRamp,nrm],[imPad,npd]];
  for(const [im,n] of all){ im.count=n; im.instanceMatrix.needsUpdate=true; }
}
function syncLive(t){                    // 每帧都在动的实例：小鱼、企鹅
  let n=0, ng=0;
  for(const f of fishList){
    if(f.dead) continue;
    const y = surfaceY(f.x,f.z)+1.0+f.lift+Math.sin(t*2.2+f.ph)*0.22, sc=f.gold?1.5:1;
    f.wy = y;
    _e.set(0, t*(f.gold?2.8:1.5)+f.ph, Math.sin(t*1.8+f.ph)*0.22); _q.setFromEuler(_e); _s.set(sc,sc,sc);
    _p.set(f.x,y,f.z); _m.compose(_p,_q,_s);
    if(f.gold){ if(ng<GOLD_CAP) imGold.setMatrixAt(ng++,_m); }
    else if(n<FISH_CAP) imFish.setMatrixAt(n++,_m);
  }
  imFish.count=n; imGold.count=ng;
  imFish.instanceMatrix.needsUpdate=true; imGold.instanceMatrix.needsUpdate=true;
  let np=0;
  for(const o of pengList){              // 海豹靠近时蹦起来欢呼
    if(np>=PENG_CAP) break;
    const near=clamp(1-Math.abs(o.z-S.z+8)/28,0,1), w=Math.sin(t*9+o.ph), hop=Math.abs(w)*0.5*near;
    _e.set(0,o.ry,w*0.2*near); _q.setFromEuler(_e); _s.set(o.s,o.s*(1+hop*0.3),o.s);
    _p.set(o.x,o.y+hop,o.z); _m.compose(_p,_q,_s); imPeng.setMatrixAt(np++,_m);
  }
  imPeng.count=np; imPeng.instanceMatrix.needsUpdate=true;
}

function resetRun(){
  for(const c of Array.from(chunks.values())) dropChunk(c);
  S.seed = (Math.random()*0x7fffffff)|0;
  Object.assign(S,{ z:0, dist:0, x:0, vx:0, vy:0, steer:0, air:false, airT:0, flip:false, slam:false, rebound:false,
    speed:20, speedMod:1, boost:0, score:0, fish:0, combo:1, comboT:0, bestCombo:1, smashed:0,
    hearts:3, inv:0, hurtT:0, hitstop:0, shake:0, flash:0, gauge:0, fever:0,
    biome:0, nextBiomeAt:700, attractT:0, ball:false, ballWob:0, nextBallAt:420 });
  ballHolder=null; hideBall();
  ensureChunks(); syncStatic(); chunksDirty=false;
  S.y = surfaceY(0,0);
  seal.root.position.set(0,S.y,0); seal.root.rotation.set(0,0,0); seal.tilt.rotation.set(0,0,0); seal.flip.rotation.set(0,0,0);
  seal.root.visible=true;
  Object.assign(J,{s:1,sv:0,hp:0,hpv:0,hy:0,hr:0,pz:0,pzv:0,px:0,pxv:0,pvx:0,pgy:S.y,pgv:0,happyT:0,mouthT:0});
  camX=0; camY=S.y; trail.n=0; trail.lastZ=1e9;
  resetGlitter();
  for(const m of rings) m.visible=false;
  paintHearts();
  ui.combo.classList.remove('on'); ui.ballhud.classList.remove('on'); ui.toast.classList.remove('on'); ui.fev.classList.remove('on');
  ui.biome.textContent = BIOMES[0].name;
  ui.flash.style.opacity = 0; ui.glow.style.opacity = 0;
}
function startRun(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const wasAttract = S.state==='attract';
  resetRun();
  S.state='play'; S.camBlend = wasAttract ? 0 : 1;
  showScreen(null);
  ui.hud.classList.remove('off');
  ui.hint.classList.remove('fade');
  setTimeout(()=>ui.hint.classList.add('fade'), 7500);
  if(isTouch){ ui.jump.classList.add('show'); ui.pause.classList.add('show'); }

}
function gameOver(quit){
  if(S.state==='over') return;
  S.state='over'; S.overAt=S.t; S.fever=0;
  seal.flip.rotation.x = wrapPi(seal.flip.rotation.x);
  ui.hud.classList.add('off');
  Snd.resume(); Snd.over(); Snd.padTarget = 0.05;
  ui.jump.classList.remove('show'); ui.pause.classList.remove('show');
  const score=Math.floor(S.score), prev=S.best, isBest = score>prev && score>0;
  if(isBest){ BEST[S.mode]=score; store.set('sealrush.best.'+S.mode, String(score)); }
  paintBest();
  $('o-title').textContent = isBest ? '新纪录' : (quit ? '收工' : '海豹晕乎乎');
  $('o-eyebrow').textContent = isBest ? '刷新了最高分' : '这一趟';
  $('o-score').textContent = fmt(score);
  $('o-dist').textContent = fmt(S.dist)+' m';
  $('o-fish').textContent = S.fish;
  $('o-combo').textContent = '×'+S.bestCombo;
  $('o-smash').textContent = S.smashed;
  $('o-combo').className = S.bestCombo>=8 ? 'hot' : '';
  $('o-score').className = isBest ? 'hot' : '';
  $('o-rec').textContent = isBest ? (prev>0 ? '比之前的最高分多 '+fmt(score-prev)+' 分' : '第一趟就留下了记录')
                                  : (prev>score ? '再多 '+fmt(prev-score+1)+' 分就能破纪录' : '');
  $('o-key').textContent = isTouch ? '' : '按空格立刻再来';
  showScreen(ui.scrOver);
}

function tryJump(){
  if(S.state!=='play') return;
  if(!S.air){
    S.air=true; S.airT=0; S.flip=false; S.slam=false; S.rebound=false;
    S.vy = 11.5 + Math.min(S.speed,50)*0.10;
    kick(5); J.mouthT=0.3; Snd.jump();
    emitSpray(S.x, S.y+0.1, S.z, 16, 1.2);
  }else if(!S.slam && !S.rebound && S.airT>0.1){            // 空中再按一次：肚皮砸地
    S.slam=true; S.flip=false; S.vy = Math.min(S.vy,-4)-18;
    seal.flip.rotation.x = wrapPi(seal.flip.rotation.x);
    kick(3); Snd.dive();
  }
}
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='m'){ Snd.setMuted(!Snd.muted); paintMute(); return; }
  if(S.state==='over' || S.state==='attract'){
    if(e.target && e.target.closest && e.target.closest('button')) return;      // 让聚焦的按钮自己响应
    if((k===' '||k==='enter') && !e.repeat && S.t-S.overAt>0.55){ e.preventDefault(); startRun(); }
    return;
  }
  if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(k==='a'||k==='arrowleft') S.keyL=true;
  else if(k==='d'||k==='arrowright') S.keyR=true;
  else if(k===' '||k==='arrowup'||k==='w') tryJump();
  else if(k==='escape'||k==='p') togglePause();
}, {passive:false});
window.addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft') S.keyL=false;
  else if(k==='d'||k==='arrowright') S.keyR=false;
});

// 按住拖动 = 模拟摇杆；轻点 = 跳
const drag = {active:false, id:null, sx:0, t0:0, steer:0, moved:false};
canvas.addEventListener('pointerdown', e=>{
  if(S.state!=='play') return;
  if(drag.active){ tryJump(); return; }                     // 第二根手指直接起跳
  drag.active=true; drag.id=e.pointerId; drag.sx=e.clientX; drag.t0=performance.now(); drag.steer=0; drag.moved=false;
  if(canvas.setPointerCapture) try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
});
canvas.addEventListener('pointermove', e=>{
  if(!drag.active || e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.sx;
  if(Math.abs(dx)>14) drag.moved=true;
  drag.steer = clamp(dx/Math.max(60,window.innerWidth*0.15), -1, 1);
});
function endDrag(e){
  if(!drag.active || e.pointerId!==drag.id) return;
  if(e.type==='pointerup' && !drag.moved && performance.now()-drag.t0<240) tryJump();
  drag.active=false; drag.steer=0;
}
canvas.addEventListener('pointerup', endDrag);

function avoid(o){                       // 标题页自动巡航用的避障力
  if(o.dead) return 0;
  const dz=S.z-o.z;
  if(dz<-4 || dz>46) return 0;
  const dx=o.x-S.x, danger=o.r+2.8, ad=Math.abs(dx);
  if(ad>=danger) return 0;
  return (dx>0?-1:1)*(1-ad/danger)*(1-dz/46)*2.4;
}
function addFever(v){
  if(S.fever>0 || S.state!=='play') return;
  S.gauge = Math.min(1,S.gauge+v);
  if(S.gauge>=1){
    S.fever=FEVER_T; kick(5); Snd.fever(); toast('狂热时间',true);
    ring(S.x,S.y,S.z,9,0xFFC94A,0.6); emitBurst(S.x,S.y+0.9,S.z,30,0xFFC94A);
  }
}
function eat(f){
  f.dead=true;
  S.comboT=2.8; S.combo=Math.min(S.combo+1,20); S.bestCombo=Math.max(S.bestCombo,S.combo);
  S.fish++;
  const gain=Math.round((f.gold?60:10)*S.combo*(S.ball?1.5:1)*(S.fever>0?2:1));
  S.score+=gain; Snd.coin(S.combo,f.gold);
  emitBurst(f.x, f.wy||S.y+1, f.z, f.gold?24:9, 0xFFC94A);
  popup((f.gold?'金鱼 +':'+')+gain, (f.gold||S.combo>=6)?'good':'');
  kick(1.5); J.mouthT=0.16; if(S.combo>=5||f.gold) J.happyT=0.5;
  addFever(f.gold?0.22:0.04);
  if(S.mode!=='zen' && S.fish%25===0 && S.hearts<3){ S.hearts++; paintHearts(); popup('补回一颗心','good'); }
}
function smash(o){
  o.dead=true; o.passed=true; chunksDirty=true; S.smashed++;
  const y=surfaceY(o.x,o.z)+1.2;
  emitBurst(o.x,y,o.z,26,o.tall?0xBFF0FF:0xFFFFFF); emitSpray(o.x,y-0.8,o.z,14,1.8);
  ring(o.x,y-1.1,o.z,3.2,0xBFF0FF,0.35);
  Snd.smash(); S.shake=Math.max(S.shake,0.3);
}
function slamBlast(){                    // 砸地：震碎附近的障碍，把周围的鱼一口气吸进来
  let n=0;
  const k=chunkK(S.z);
  if(S.mode!=='zen') for(const c of [chunks.get(k-1),chunks.get(k),chunks.get(k+1)]){
    if(!c) continue;
    for(const list of [c.rocks,c.pillars]) for(const o of list){
      if(o.dead) continue;
      const dx=o.x-S.x, dz=o.z-S.z;
      if(dx*dx+dz*dz<SLAM_R*SLAM_R){ smash(o); n++; }
    }
  }
  for(const f of fishList){
    if(f.dead) continue;
    const dx=f.x-S.x, dz=f.z-S.z;
    if(dx*dx+dz*dz<22 && f.lift<2) eat(f);
  }
  const bonus=Math.round((20+n*40)*S.combo);
  S.score+=bonus; addFever(0.05+n*0.06);
  popup(n ? '砸碎 ×'+n+'  +'+bonus : '肚皮砸地 +'+bonus, 'good');
  if(n) S.hitstop=0.05;
}
function land(groundY,play){
  const impact = clamp(-S.vy/22,0,1.6);
  S.y=groundY;
  if(S.slam){
    S.slam=false; S.rebound=true; S.vy=9; S.airT=0;        // 砸完会 Q 弹地蹦起来一下
    kick(-10); S.shake=Math.max(S.shake,0.7); Snd.slam();
    ring(S.x,groundY,S.z,7.5,0xFFFFFF,0.5); ring(S.x,groundY,S.z,4,0xA9F0E0,0.35);
    emitSpray(S.x,groundY+0.2,S.z,54,2.6);
    if(play) slamBlast();
    return;
  }
  if(S.vy<-3){
    Snd.land(); emitSpray(S.x, groundY+0.15, S.z, Math.round(10+impact*22), 1+impact);
    S.shake = Math.max(S.shake, impact*0.3); kick(-3-impact*5);
    if(impact>0.45) ring(S.x,groundY,S.z,3.4,0xFFFFFF,0.4);
  }
  if(S.flip){
    seal.flip.rotation.x -= TAU;
    if(play){
      const bonus = Math.round((60+S.airT*90)*S.combo);
      S.score += bonus; Snd.flip(); popup('后空翻 +'+bonus,'good'); J.happyT=0.9; addFever(0.12);
    }
  }
  S.air=false; S.flip=false; S.rebound=false; S.vy=0; S.airT=0;
}
function updateSeal(dt,t){
  const play = S.state==='play';
  const base = surfaceY(S.x,S.z);
  const c0 = chunks.get(chunkK(S.z));

  // 跳台
  let lift=0, ramp=null;
  if(c0) for(const r of c0.ramps){
    if(Math.abs(S.x-r.x)<r.w && S.z<=r.z && S.z>=r.z-r.len){ lift = r.h*clamp((r.z-S.z)/r.len,0,1); ramp=r; }
  }
  if(ramp && !S.air && S.z < ramp.z-ramp.len*0.86){
    S.air=true; S.airT=0; S.flip=true; S.slam=false; S.rebound=false;
    S.vy = 6.5 + Math.min(S.speed,50)*0.26 + lift*1.6;
    S.airDur = 2*S.vy/GRAV + 0.1;
    kick(6); Snd.jump(); emitSpray(S.x, base+lift+0.2, S.z, 24, 1.7);
  }
  const groundY = base+lift;

  if(S.air){
    S.airT += dt; S.vy -= GRAV*dt; S.y += S.vy*dt;
    if(S.y<=groundY && S.vy<=0) land(groundY,play);
  }else{
    S.y = Math.max(groundY, damp(S.y,groundY,22,dt));
  }

  // 转向
  let steer=0;
  if(play){
    if(S.keyL) steer-=1;
    if(S.keyR) steer+=1;
    if(drag.active && Math.abs(drag.steer)>0.06) steer+=drag.steer;
  }else{
    let bx=null, bd=1e9;
    for(const f of fishList){
      if(f.dead||f.lift>1) continue;
      const dz=S.z-f.z;
      if(dz>2 && dz<60){ const d=Math.abs(f.x-S.x)+dz*0.05; if(d<bd){ bd=d; bx=f.x; } }
    }
    steer = bx===null ? Math.sin(t*0.5)*0.5 : clamp((bx-S.x)*0.4,-1,1);
    for(const c of chunks.values()){
      if(c.zBot>S.z+6 || c.zTop<S.z-46) continue;
      for(const o of c.pillars) steer+=avoid(o);
      for(const o of c.rocks) steer+=avoid(o);
    }
  }
  steer = clamp(steer,-1,1);
  S.steer = damp(S.steer,steer,12,dt);
  S.vx += S.steer*(S.air?24:30)*dt;
  S.vx = damp(S.vx,0,S.air?0.7:3.4,dt);
  S.x += S.vx*dt;
  const lim = TRACK_HALF-0.9;
  if(Math.abs(S.x)>lim){
    const hard = S.vx*Math.sign(S.x) > 5;
    S.x = clamp(S.x,-lim,lim);
    if(hard && play){
      S.speedMod = Math.min(S.speedMod,0.72); S.shake = Math.max(S.shake,0.16); kick(-3);
      emitSpray(S.x, base+0.2, S.z, 14, 1.3);
      if(S.ball) dropBall('蹭到雪墙，金球掉了');
    }
    S.vx *= -0.15;
  }

  // 前进
  const cap = !play ? 23 : (S.mode==='zen' ? 38 : 56);
  S.speed = damp(S.speed, Math.min(cap, 20+Math.max(0,-S.z)*0.014), S.mode==='zen'?0.5:0.75, dt);
  S.speedMod = damp(S.speedMod,1,1.5,dt);
  if(S.boost>0) S.boost -= dt;
  const v = S.speed*S.speedMod*(S.ball?1.06:1)*(S.boost>0?1.32:1)*(S.fever>0?1.12:1);
  S.z -= v*dt;
  if(play) S.dist = -S.z;

  // 姿态
  seal.root.position.set(S.x,S.y,S.z);
  seal.root.rotation.y = damp(seal.root.rotation.y, clamp(-S.vx*0.05,-0.55,0.55), 10, dt);
  seal.tilt.rotation.z = damp(seal.tilt.rotation.z, clamp(-S.vx*0.045,-0.5,0.5), 8, dt);
  if(S.air && S.flip){
    seal.flip.rotation.x = Math.max(seal.flip.rotation.x, TAU*clamp(S.airT/S.airDur,0,1));
  }else{
    const pitch = S.slam ? -0.3 : S.air ? clamp(S.vy*0.045,-0.7,0.8) : slopeAt(S.x,S.z)+(ramp?Math.atan(ramp.h/ramp.len):0);
    seal.flip.rotation.x = damp(seal.flip.rotation.x, pitch, 9, dt);
  }

  // 雪雾（急转弯时外侧甩得更多）与滑痕
  const grounded = !S.air && lift<0.05;
  if(!S.air){
    sprayAcc += (0.5+v*0.10+Math.abs(S.steer)*v*0.14)*dt*(REDUCED?0.5:1);
    while(sprayAcc>1){ sprayAcc-=1; emitSpray(S.x-S.steer*0.7, base+lift+0.1, S.z+0.7, 1, 0.55+v*0.012+Math.abs(S.steer)*0.5); }
  }
  pushTrail(S.x, S.z+0.5, grounded?1:0);
}
function updateOver(dt,t){               // 结束后：滑行着停下，瘫成一团，头顶冒星星
  S.speed = damp(S.speed,0,2.2,dt);
  S.z -= S.speed*S.speedMod*dt;
  const gy = surfaceY(S.x,S.z);
  if(S.air){
    S.vy -= GRAV*dt; S.y += S.vy*dt;
    if(S.y<=gy){ S.y=gy; S.air=false; S.slam=false; S.flip=false; S.rebound=false; kick(-5); }
  }else S.y = Math.max(gy, damp(S.y,gy,10,dt));
  seal.root.position.set(S.x,S.y,S.z);
  seal.tilt.rotation.z = damp(seal.tilt.rotation.z, 0, 4, dt);
  seal.flip.rotation.x = damp(seal.flip.rotation.x, S.air?0:slopeAt(S.x,S.z), 4, dt);
  pushTrail(S.x, S.z+0.5, S.air?0:1);
}

/* ---- 金球：顶在鼻尖上，转弯越急晃得越厉害 ---- */
function dropBall(reason){
  if(!S.ball) return;
  S.ball=false; S.ballWob=0; ballHolder=null; hideBall();
  ui.ballhud.classList.remove('on');
  emitBurst(S.x, S.y+1.6, S.z-1.2, 18, 0xFFC94A);
  Snd.ballDrop(); popup(reason,'bad');
}
function updateBall(dt,t){
  if(ballHolder){
    ballHolder.age += dt;
    ballHolder.y = surfaceY(ballHolder.x,ballHolder.z)+1.0+Math.sin(t*2.6)*0.22;
    const dx=ballHolder.x-S.x, dz=ballHolder.z-S.z;
    if(dx*dx+dz*dz<4.4){
      ballHolder=null; S.ball=true; S.ballWob=0; J.happyT=1.2; kick(3);
      ui.ballhud.classList.add('on'); Snd.ballCatch(); popup('接住了','good');
      emitBurst(ballMesh.position.x, ballMesh.position.y, ballMesh.position.z, 22, 0xFFC94A);
    }else if(dz>30){ ballHolder=null; hideBall(); }
  }
  if(!ballHolder && !S.ball && S.dist>S.nextBallAt){
    S.nextBallAt = S.dist+800+Math.random()*500;
    const x=LANES[1+((Math.random()*4)|0)], z=S.z-210;
    ballHolder={x,z,y:0,age:0}; ballMesh.visible=true; ballHalo.visible=true;
    toast('金球来了');
  }
  if(S.ball){
    S.ballWob += (Math.abs(S.steer)*1.15 + Math.abs(S.vx)*0.028 + (S.boost>0?0.9:0) + (S.air?0.45:0) + (S.slam?3:0))*dt;
    S.ballWob = Math.max(0, S.ballWob-dt*0.62);
    if(S.ballWob>WOB_MAX) dropBall('晃得太厉害，金球掉了');
    else{
      S.score += (16+S.combo*2.2)*dt;
      ui.wobBar.style.width = (S.ballWob/WOB_MAX*100)+'%';
      ui.wob.classList.toggle('warn', S.ballWob>1.15);
    }
  }
}
function placeBall(dt,t){
  if(!ballMesh.visible) return;
  if(S.ball){
    const w=S.ballWob;
    seal.noseAnchor.getWorldPosition(_p);
    ballMesh.position.set(_p.x+Math.sin(t*9)*w*0.16, _p.y-w*w*0.03, _p.z+Math.sin(t*7.4)*w*0.12);
  }else if(ballHolder) ballMesh.position.set(ballHolder.x,ballHolder.y,ballHolder.z);
  ballMesh.rotation.y += dt*1.8; ballMesh.rotation.x += dt*1.1;
  ballHalo.position.copy(ballMesh.position);
}

/* ---- 小鱼 / 加速带 / 障碍 ---- */
function onHit(o){
  o.passed=true;
  S.inv=1.2; S.hurtT=1.0; S.hitstop=0.09; S.hearts--; paintHearts();
  S.speedMod=0.35; S.combo=1; S.comboT=0; S.shake=0.85; S.flash=1; kick(-9);
  Snd.hit(); emitBurst(o.x, surfaceY(o.x,o.z)+1.0, o.z, 26, 0xFFFFFF);
  if(S.ball) dropBall('撞掉了金球'); else popup('撞上了','bad');
  if(S.hearts<=0) gameOver(false);
}
function updatePickups(dt){
  const px=S.x, pz=S.z, mag=S.fever>0, cy=S.y+0.6;
  for(const f of fishList){
    if(f.dead) continue;
    const dz=f.z-pz;
    if(dz>3 || dz<(mag?-18:-3)) continue;
    let dx=f.x-px;
    if(mag && Math.abs(dx)<8){ f.x=damp(f.x,px,7,dt); f.lift=damp(f.lift,0,6,dt); dx=f.x-px; }     // 狂热时鱼会自己凑过来
    if(dx*dx+dz*dz<(mag?4.5:2.1) && Math.abs((f.wy||cy)-cy)<2.4) eat(f);
  }
  if(S.comboT>0){ S.comboT-=dt; if(S.comboT<=0) S.combo=1; }

  const k=chunkK(pz), c=chunks.get(k);
  if(!c) return;
  for(const p of c.pads){
    if(p.used || Math.abs(p.z-pz)>2.8 || Math.abs(p.x-px)>1.9 || S.air) continue;
    p.used=true; S.boost=1.5; kick(4); Snd.pad();
    emitBurst(p.x, S.y+0.5, p.z, 14, 0x5FE0BE); popup('加速','good');
  }
  if(S.mode==='zen') return;
  const clear = S.y-surfaceY(px,pz);                         // 肚皮离雪面多高
  for(const cc of [c, chunks.get(k+1)]){
    if(!cc) continue;
    for(const list of [cc.rocks,cc.pillars]) for(const o of list){
      if(o.dead) continue;
      const dx=o.x-px, dz=o.z-pz;
      if(!o.passed && dz>1.4){                               // 刚刚从它身边过去
        o.passed=true;
        if(!S.air && !mag && S.inv<=0 && Math.abs(dx)<o.r+2.1){
          const b=Math.round(15*S.combo); S.score+=b; popup('擦边 +'+b,'good'); Snd.near(); addFever(0.08);
        }
        continue;
      }
      const rr=o.r+0.7;
      if(dx*dx+dz*dz>=rr*rr) continue;
      if(!o.tall && S.air && clear>o.top*0.8) continue;      // 岩石可以跳过去
      if(mag){ smash(o); const b=Math.round(40*S.combo); S.score+=b; popup('撞碎 +'+b,'good'); S.hitstop=0.04; continue; }
      if(S.inv>0) continue;
      onHit(o); return;
    }
  }
}
function attractEat(){                   // 标题页的海豹也真的在吃鱼
  for(const f of fishList){
    if(f.dead) continue;
    const dz=f.z-S.z;
    if(dz>2.5 || dz<-2.5) continue;
    const dx=f.x-S.x;
    if(dx*dx+dz*dz<2.1 && f.lift<1.5){ f.dead=true; emitBurst(f.x, f.wy||S.y+1, f.z, 7, 0xFFC94A); kick(1.5); J.mouthT=0.16; J.happyT=0.4; }
  }
}

/* ---- 天色过渡 ---- */
let skyTimer = 1;
const _c1 = new THREE.Color(), WHITE = new THREE.Color(1,1,1);
function updateBiome(dt){
  if(S.state==='play' && S.dist>S.nextBiomeAt){
    S.biome=(S.biome+1)%BIOMES.length; S.nextBiomeAt=S.dist+850+Math.random()*400;
    ui.biome.textContent=BIOMES[S.biome].name; toast(BIOMES[S.biome].name);
  }else if(S.state==='attract'){
    S.attractT+=dt;
    if(S.attractT>11){ S.attractT=0; S.biome=(S.biome+1)%BIOMES.length; }
  }
  const B=BIOMES[S.biome], l=0.8, a=1-Math.exp(-l*dt);
  for(let i=0;i<4;i++) cur.sky[i].lerp(B.sky[i],a);
  cur.fog.lerp(B.fog,a); cur.hemiS.lerp(B.hemiS,a); cur.hemiG.lerp(B.hemiG,a); cur.sun.lerp(B.sun,a);
  cur.sunDir.lerp(B.sunDir,a).normalize();
  cur.fogN=damp(cur.fogN,B.fogN,l,dt); cur.fogF=damp(cur.fogF,B.fogF,l,dt);
  cur.hemiI=damp(cur.hemiI,B.hemiI,l,dt); cur.sunI=damp(cur.sunI,B.sunI,l,dt);
  cur.aur=damp(cur.aur,B.aur,l,dt); cur.star=damp(cur.star,B.star,l,dt);

  scene.fog.color.copy(cur.fog); scene.fog.near=cur.fogN; scene.fog.far=cur.fogF;
  hemi.color.copy(cur.hemiS); hemi.groundColor.copy(cur.hemiG); hemi.intensity=cur.hemiI;
  sun.color.copy(cur.sun); sun.intensity=cur.sunI;
  sunSprite.material.color.copy(cur.sun); sunSprite.material.opacity=clamp(0.35+cur.sunI*0.2,0,0.95);
  stars.material.opacity=cur.star*0.95; stars.visible=cur.star>0.01;
  auroraMat.opacity=cur.aur*(0.8+Math.sin(S.t*0.7)*0.15); for(const m of auroras) m.visible=cur.aur>0.01;
  mtnMats[0].color.copy(cur.fog).lerp(cur.sky[1],0.42);
  mtnMats[1].color.copy(cur.fog).lerp(cur.sky[1],0.2);
  cloudMat.color.copy(cur.sky[3]).lerp(WHITE,0.6); cloudMat.opacity=0.8*(1-cur.star*0.8);
  skyTimer+=dt;
  if(skyTimer>0.2){ skyTimer=0; paintSky(); }
}

/* ---- 镜头：标题页在海豹正前方绕着看，开局后绕到身后 ---- */
const tLook = new THREE.Vector3();
let voSet = false;
function updateCamera(dt){
  const spdN = clamp((S.speed-20)/36,0,1);
  const back = 8.6+spdN*3.0, up = 4.1+spdN*0.5;
  camX = damp(camX, S.x*0.55, 6, dt);
  camY = damp(camY, S.y, 6, dt);
  const b = smooth(S.camBlend);
  const a0 = Math.sin(S.t*0.21)*0.8+0.2;
  const w=window.innerWidth, hh=window.innerHeight, portrait = w/hh<=1.15;
  const R0 = portrait ? 6.6*Math.pow(Math.max(1,1.15*hh/w),0.75) : 6.6;      // 竖屏视野窄，镜头退远一些
  const th = lerp(a0, Math.PI, b), R = lerp(R0, back, b), h = lerp(1.35, up, b);
  camera.position.set(lerp(S.x,camX,b)+Math.sin(th)*R, camY+h, S.z-Math.cos(th)*R);
  const gy = surfaceY(camera.position.x,camera.position.z)+0.9;
  if(camera.position.y<gy) camera.position.y=gy;
  tLook.set(lerp(S.x,camX*1.3,b), camY+lerp(0.85,0.1,b), S.z-lerp(0.5,12+spdN*5,b));
  camera.lookAt(tLook);
  camera.rotation.z += clamp(-S.vx*0.006,-0.1,0.1)*b;
  camera.fov = damp(camera.fov, lerp(40, 62+spdN*14+(S.boost>0?4:0)+(S.fever>0?5:0), b), 5, dt);
  // 标题页把海豹让到没被文字盖住的那一侧
  const k=1-b;
  if(k>0.001){
    if(!portrait) camera.setViewOffset(w,hh,-w*0.19*k,0,w,hh); else camera.setViewOffset(w,hh,0,hh*0.25*k,w,hh);
    voSet=true;
  }else if(voSet){ camera.clearViewOffset(); voSet=false; }
  camera.updateProjectionMatrix();
  if(S.shake>0.002){
    const s=S.shake*(REDUCED?0.3:1);
    camera.position.x+=(Math.random()-0.5)*s*0.85; camera.position.y+=(Math.random()-0.5)*s*0.85;
  }
}

/* ============================================================
   15. 主循环
   ============================================================ */
let last = performance.now()/1000, hudAcc = 0, booted = false;
function frame(ms){
  requestAnimationFrame(frame);
  const now = ms/1000;
  let dt = clamp(now-last, 0.001, 0.05);
  last = now;
  if(S.state==='pause') return;
  if(S.hitstop>0){ S.hitstop-=dt; dt*=0.08; }             // 撞击瞬间的顿帧
  S.t += dt;
  const play = S.state==='play';

  updateBiome(dt);
  if(play || S.state==='attract') updateSeal(dt,S.t); else updateOver(dt,S.t);
  ensureChunks();
  if(play){
    updatePickups(dt);
    if(S.state==='play') updateBall(dt,S.t);
    S.score += S.speed*dt*0.9*(S.fever>0?2:1);
    if(S.inv>0) S.inv -= dt;
    if(S.fever>0){
      S.fever -= dt;
      if(S.fever<=0){ S.fever=0; S.gauge=0; S.inv=Math.max(S.inv,1.2); }
    }else S.gauge = Math.max(0, S.gauge-0.008*dt);
    S.camBlend = Math.min(1, S.camBlend+dt/1.25);
  }else if(S.state==='attract') attractEat();
  animateSeal(dt,S.t);
  if(chunksDirty){ syncStatic(); chunksDirty=false; }
  syncLive(S.t);
  placeBall(dt,S.t);
  seal.root.visible = !(S.inv>0 && S.state==='play' && Math.floor(S.t*16)%2===0);
  S.shake = damp(S.shake,0,4.5,dt);
  S.flash = damp(S.flash,0,5,dt);
  updateTrail();
  updateRings(dt);
  updateCamera(dt);
  updateSpeedLines(dt);
  updateGlitter(S.t);
  TEX_PAD.offset.y = (TEX_PAD.offset.y - dt*1.6 + 1)%1;

  // 天空与灯光跟着镜头 / 海豹走
  const cp = camera.position;
  skyMesh.position.copy(cp); stars.position.copy(cp);
  for(const m of auroras){ const o=m.userData.off; m.position.set(cp.x+o[0], cp.y+o[1], cp.z+o[2]); }
  TEX_AURORA.offset.x = (TEX_AURORA.offset.x+dt*0.008)%1;
  mtns[0].position.set(cp.x, cp.y-140, cp.z); mtns[1].position.set(cp.x, cp.y-190, cp.z);
  for(const s of clouds){
    const u=s.userData; u.az+=u.sp*dt; if(u.az>1.9) u.az-=3.8; else if(u.az<-1.9) u.az+=3.8;
    const ce=Math.cos(u.el);
    s.position.set(cp.x+Math.sin(u.az)*ce*1380, cp.y+Math.sin(u.el)*1380, cp.z-Math.cos(u.az)*ce*1380);
  }
  sunSprite.position.copy(cp).addScaledVector(cur.sunDir,1440);
  sun.position.copy(seal.root.position).addScaledVector(cur.sunDir,90);
  sun.target.position.copy(seal.root.position);
  rim.position.set(S.x+6, S.y+6.6, S.z+9); rim.target.position.copy(seal.root.position);

  // 粒子
  { const a=snow.geometry.attributes.position.array, drift=S.speed*0.55;
    for(let i=0;i<SNOWN;i++){
      const o=i*3;
      a[o]   = wrap(a[o]+(snowVel[o]-S.vx*0.06)*dt, cp.x, SNOW_HX);
      a[o+1] = wrap(a[o+1]+snowVel[o+1]*dt, cp.y, SNOW_HY);
      a[o+2] = wrap(a[o+2]+(snowVel[o+2]+drift)*dt, cp.z, SNOW_HZ);
    }
    snow.geometry.attributes.position.needsUpdate=true; }
  { const a=spray.geometry.attributes.position.array, back=S.speed*0.8;
    for(let i=0;i<SPRAYN;i++){
      if(sprayL[i]<=0) continue;
      const o=i*3; sprayL[i]-=dt;
      if(sprayL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=sprayV[o]*dt; a[o+1]+=sprayV[o+1]*dt; a[o+2]+=(sprayV[o+2]+back)*dt; sprayV[o+1]-=7*dt;
    }
    spray.geometry.attributes.position.needsUpdate=true; }
  { const a=burst.geometry.attributes.position.array, back=S.speed*0.7;
    for(let i=0;i<BURSTN;i++){
      if(burstL[i]<=0) continue;
      const o=i*3; burstL[i]-=dt;
      if(burstL[i]<=0){ a[o+1]=-9999; continue; }
      a[o]+=burstV[o]*dt; a[o+1]+=burstV[o+1]*dt; a[o+2]+=(burstV[o+2]+back)*dt; burstV[o+1]-=12*dt;
    }
    burst.geometry.attributes.position.needsUpdate=true; }

  Snd.frame(dt, S.speed*S.speedMod, play, S.fever>0, S.mode==='zen');

  hudAcc += dt;
  if(hudAcc>0.07){
    hudAcc=0;
    ui.dist.textContent=fmt(S.dist); ui.score.textContent=fmt(S.score);
    ui.spd.textContent=Math.round(S.speed*S.speedMod*(S.boost>0?1.32:1)*(S.fever>0?1.12:1)*3.6);
    const on = S.combo>1 && S.comboT>0 && play;
    ui.combo.classList.toggle('on',on);
    if(on){ ui.comboB.textContent='×'+S.combo; ui.comboBar.style.transform='scaleX('+clamp(S.comboT/2.8,0,1)+')'; }
    ui.fev.classList.toggle('on', S.fever>0);
    ui.fevBar.style.width = ((S.fever>0 ? S.fever/FEVER_T : S.gauge)*100).toFixed(1)+'%';
    ui.flash.style.opacity = S.flash>0.01 ? S.flash.toFixed(2) : 0;
    ui.glow.style.opacity = S.fever>0 ? (0.4+Math.sin(S.t*10)*0.12).toFixed(2) : 0;
  }
  renderer.render(scene,camera);
  if(!booted){ booted=true; window.__sealReady=true; $('boot').classList.add('done'); }
}

/* ============================================================
   16. 启动
   ============================================================ */
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(S.state==='pause') renderer.render(scene,camera);
}
window.addEventListener('resize', onResize);

function start(saved){
  if(saved && saved.best) for(const k of ['rush','zen']) if(saved.best[k]>BEST[k]) BEST[k]=saved.best[k];
  paintBest();
  if(isTouch){
    ui.hint.textContent='拖动转向 · 轻点跳 · 空中再点 砸地';
    $('ctl-text').innerHTML='按住屏幕左右拖动转向，轻点一下起跳，空中再点一次砸地<br>贴着障碍擦过去有奖励';
  }
  paintModes(); paintMute(); paintSky();
  onResize();
  resetRun();
  showScreen(ui.scrStart);
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
try{ if(hot && hot.snapshot) hot.snapshot(()=>({best:BEST})); }catch(e){}
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

// 浏览器要求先有一次交互才能出声
const unlock = ()=>{ Snd.init(); Snd.resume(); };
window.addEventListener('pointerdown', unlock, {once:true});
window.addEventListener('keydown', unlock, {once:true});
</script>
